<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PTCG Collector</title>
  <meta name="theme-color" content="#080c18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/lucide.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg:          #080c18;
  --surface:     #0e1525;
  --surface-2:   #141e33;
  --surface-3:   #1a2540;
  --border:      #1e2d4a;
  --border-2:    #243558;
  --primary:     #3b82f6;
  --primary-dim: rgba(59,130,246,.12);
  --primary-glow:rgba(59,130,246,.25);
  --gold:        #f59e0b;
  --gold-dim:    rgba(245,158,11,.12);
  --green:       #10b981;
  --green-dim:   rgba(16,185,129,.12);
  --red:         #ef4444;
  --red-dim:     rgba(239,68,68,.12);
  --purple:      #8b5cf6;
  --purple-dim:  rgba(139,92,246,.12);
  --text:        #e2e8f0;
  --text-2:      #94a3b8;
  --text-3:      #4a5568;
  --font-display:'Orbitron', sans-serif;
  --font-body:   'Nunito', sans-serif;
  --font-mono:   'JetBrains Mono', monospace;
  --radius:      12px;
  --radius-sm:   8px;
  --radius-lg:   16px;
  --shadow:      0 4px 24px rgba(0,0,0,.4);
  --shadow-lg:   0 8px 40px rgba(0,0,0,.6);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body {
  padding-bottom: 80px;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(59,130,246,.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(139,92,246,.06) 0%, transparent 60%);
}

.app-header {
  position: sticky; top: 0; z-index: 30;
  background: rgba(8,12,24,.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 900px; margin: 0 auto;
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.header-logo { display: flex; align-items: center; gap: 8px; }
.logo-bolt { font-size: 18px; filter: drop-shadow(0 0 8px #f59e0b); }
.logo-text {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 900;
  letter-spacing: .5px; color: var(--text);
}
.logo-accent { color: var(--primary); }
.header-nav { display: none; }
@media(min-width:600px) {
  .header-nav { display: flex; gap: 4px; }
  .hnav-btn {
    background: transparent; border: none; color: var(--text-2);
    font-family: var(--font-body); font-size: 13px; font-weight: 700;
    padding: 6px 14px; border-radius: 99px; cursor: pointer;
    transition: all .2s;
  }
  .hnav-btn.active { background: var(--primary-dim); color: var(--primary); }
  .hnav-btn:hover:not(.active) { background: var(--surface-2); color: var(--text); }
}

.bottom-nav {
  position: fixed; bottom: 0; width: 100%; z-index: 40;
  background: rgba(8,12,24,.96);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
}
.bnav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; background: none; border: none;
  font-family: var(--font-body); font-size: 9px; font-weight: 800;
  letter-spacing: .8px; color: var(--text-3); cursor: pointer;
  padding: 4px 0; transition: color .2s;
}
.bnav-btn.active { color: var(--primary); }
.bnav-icon { font-size: 20px; line-height: 1; transition: transform .2s; }
.bnav-btn.active .bnav-icon { transform: scale(1.1); filter: drop-shadow(0 0 6px var(--primary)); }
@media(min-width:600px) { .bottom-nav { display: none; } body { padding-bottom: 0; } }

main { max-width: 900px; margin: 0 auto; padding: 16px; }

.surface-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: .2px;
}

.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.page-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700; color: var(--text);
}

.btn-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 18px; border-radius: 99px;
  font-family: var(--font-body); font-size: 13px; font-weight: 800;
  border: none; cursor: pointer; transition: all .2s; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 12px var(--primary-glow); }
.btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
.btn-ghost {
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border-2);
}
.btn-ghost:hover { background: var(--surface-3); color: var(--text); }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,.3); }
.btn-amber { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(245,158,11,.3); }
.btn-xs { padding: 5px 12px; font-size: 11px; }
.w-full { width: 100%; justify-content: center; }
.green-txt { color: var(--green) !important; }
.red-txt { color: var(--red) !important; }
.btn-back {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface-2); border: 1px solid var(--border-2);
  color: var(--text-2); font-family: var(--font-body);
  font-size: 12px; font-weight: 700;
  padding: 6px 12px; border-radius: 99px; cursor: pointer;
}
.btn-back:hover { color: var(--text); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2);
  font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.icon-btn.danger:hover { background: var(--red-dim); border-color: var(--red); }

.inp {
  width: 100%; background: var(--surface-2);
  border: 1px solid var(--border-2); border-radius: var(--radius-sm);
  color: var(--text); font-family: var(--font-body); font-size: 14px;
  padding: 10px 14px; outline: none; transition: border-color .2s;
}
.inp::placeholder { color: var(--text-3); }
.inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
.inp-mono { font-family: var(--font-mono); font-size: 12px; resize: vertical; }
.inp-search { padding-left: 14px; }
.select-inp { appearance: none; cursor: pointer; }
.form-stack { display: flex; flex-direction: column; gap: 10px; }
.btn-row { display: flex; justify-content: flex-end; gap: 8px; }

.deck-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media(min-width:560px) { .deck-grid { grid-template-columns: 1fr 1fr; } }
.deck-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px; cursor: pointer;
  transition: all .2s; display: flex; flex-direction: column; gap: 8px;
}
.deck-card:hover { border-color: var(--border-2); background: var(--surface-2); transform: translateY(-2px); box-shadow: var(--shadow); }
.deck-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.deck-card-name { font-size: 15px; font-weight: 800; color: var(--text); flex: 1; }
.deck-card-desc { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck-card-footer { display: flex; align-items: center; gap: 6px; }
.confirm-row { display: flex; gap: 6px; align-items: center; }

.sets-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media(min-width:560px) { .sets-grid { grid-template-columns: 1fr 1fr; } }
.set-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px; cursor: pointer;
  transition: all .2s;
}
.set-card:hover { border-color: var(--primary); background: var(--surface-2); }
.pokedex-card { border-color: rgba(239,68,68,.3); background: var(--surface); }
.pokedex-card:hover { border-color: var(--red); }
.set-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.set-card-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.set-card-count { font-size: 12px; font-weight: 700; color: var(--text-2); white-space: nowrap; }
.set-card-pct { font-size: 10px; color: var(--text-3); text-align: right; margin-top: 3px; }

.progress-track {
  height: 6px; background: var(--surface-3);
  border-radius: 99px; overflow: hidden;
}
.progress-row { display: flex; align-items: center; gap: 10px; }
.progress-row .progress-track { flex: 1; }
.progress-pct { font-size: 12px; font-weight: 800; color: var(--text-2); white-space: nowrap; }
.progress-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }
.progress-fill.blue  { background: var(--primary); }
.progress-fill.green { background: var(--green); }
.progress-fill.red   { background: var(--red); }
.progress-fill.gold  { background: var(--gold); }
.progress-fill.glow  { box-shadow: 0 0 8px currentColor; }

.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 99px;
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
  white-space: nowrap;
}
.badge-dim    { background: var(--surface-3); color: var(--text-2); }
.badge-blue   { background: var(--primary-dim); color: var(--primary); }
.badge-green  { background: var(--green-dim); color: var(--green); }
.badge-red    { background: var(--red-dim); color: var(--red); }
.badge-amber  { background: var(--gold-dim); color: var(--gold); }
.badge-purple { background: var(--purple-dim); color: var(--purple); }
.chip {
  padding: 5px 12px; border-radius: 99px;
  border: 1px solid var(--border-2); background: var(--surface-2);
  color: var(--text-2); font-family: var(--font-body);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.chip.active { background: var(--primary-dim); color: var(--primary); border-color: var(--primary); }

.counter-group {
  display: flex; align-items: center; gap: 2px;
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 3px; flex-shrink: 0;
}
.counter-btn {
  width: 28px; height: 28px; border: none; background: transparent;
  color: var(--text-2); font-size: 16px; font-weight: 700; cursor: pointer;
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.counter-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.counter-btn:disabled { opacity: .2; cursor: default; }
.counter-val {
  min-width: 26px; text-align: center;
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  color: var(--text-3);
}
.counter-val.active { color: var(--primary); }
.counter-val.green  { color: var(--green); }
.counter-val.amber  { color: var(--gold); }
.counter-val.dim    { color: var(--text-3); }

.checkbox {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  border: 2px solid var(--border-2); background: transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; color: #fff; transition: all .2s;
}
.checkbox.checked { background: var(--green); border-color: var(--green); box-shadow: 0 0 8px rgba(16,185,129,.3); }
.checkbox.amber.checked { background: var(--gold); border-color: var(--gold); }
.checkbox.sm { width: 18px; height: 18px; border-radius: 5px; font-size: 10px; }

.sub-tabs {
  display: flex; gap: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 6px;
}
.sub-tab {
  flex: 1; padding: 8px; border-radius: var(--radius-sm);
  border: none; font-family: var(--font-body); font-size: 12px; font-weight: 800;
  color: var(--text-3); background: transparent; cursor: pointer; transition: all .2s;
}
.sub-tab.active {
  background: var(--primary); color: #fff;
  box-shadow: 0 2px 8px var(--primary-glow);
}

.search-row { display: flex; gap: 8px; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.search-filters { display: flex; flex-direction: column; gap: 8px; }
.count-label { font-size: 11px; color: var(--text-3); font-weight: 700; }

.card-list { display: flex; flex-direction: column; gap: 8px; }
.list-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px;
  transition: border-color .2s;
}
.list-card.owned { border-color: var(--border-2); }
.list-card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.list-card-meta { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.list-card-name { font-size: 13px; font-weight: 800; color: var(--text); }
.print-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.print-chip {
  font-family: var(--font-mono); font-size: 10px;
  background: var(--surface-2); color: var(--primary);
  border: 1px solid var(--border-2); border-radius: 5px;
  padding: 2px 7px; cursor: pointer; transition: all .15s;
  text-decoration: underline dotted;
}
.print-chip:hover { background: var(--primary-dim); }
.list-card-desc { font-size: 11px; color: var(--text-2); line-height: 1.5; }

.detail-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.detail-title-row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
.detail-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text); }
.detail-count { font-size: 12px; font-weight: 700; color: var(--text-2); white-space: nowrap; }

.type-filter-row { display: flex; gap: 6px; }
.type-btn {
  flex: 1; padding: 8px 4px; border-radius: var(--radius-sm);
  border: 2px solid var(--border); background: var(--surface-2);
  color: var(--text-2); font-family: var(--font-body);
  font-size: 11px; font-weight: 800; cursor: pointer; text-align: center;
  transition: all .2s;
}
.type-btn.active-purple { border-color: var(--purple); background: var(--purple-dim); color: var(--purple); }
.type-btn.active-blue   { border-color: var(--primary); background: var(--primary-dim); color: var(--primary); }
.type-btn.active-gold   { border-color: var(--gold); background: var(--gold-dim); color: var(--gold); }
.type-sub { font-size: 9px; font-family: var(--font-mono); font-weight: 400; display: block; margin-top: 2px; opacity: .7; }

.status-filter-row { display: flex; gap: 5px; }
.status-btn {
  flex: 1; padding: 7px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-3); font-family: var(--font-body);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all .2s;
}
.status-btn.active         { background: var(--surface-3); color: var(--text); border-color: var(--text-3); }
.status-btn.green.active   { background: var(--green-dim); color: var(--green); border-color: var(--green); }
.status-btn.red.active     { background: var(--red-dim); color: var(--red); border-color: var(--red); }
.export-row { display: flex; gap: 6px; flex-wrap: wrap; }

.set-card-list { display: flex; flex-direction: column; }
.set-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  transition: background .1s; cursor: pointer;
}
.set-row:hover { background: var(--surface-2); }
.set-row.owned { background: rgba(16,185,129,.04); }
.set-row + .set-row { border-top: 1px solid var(--border); }
.set-row-check { flex-shrink: 0; }
.set-row-info { flex: 1; min-width: 0; }
.set-row-name { display: block; font-size: 13px; font-weight: 700; color: var(--text); }
.set-row-name.owned-text { color: var(--green); }
.set-row-code { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
.ver-link { cursor: pointer; margin-left: 4px; font-size: 11px; }

.deck-desc { font-size: 12px; color: var(--text-2); margin-bottom: 12px; }
.deck-stats { display: flex; flex-direction: column; gap: 6px; }
.deck-stats-row { display: flex; align-items: center; justify-content: space-between; }
.toggle-missing-btn {
  width: 100%; margin-bottom: 12px; padding: 10px;
  border-radius: var(--radius); border: 1px solid var(--border-2);
  background: var(--surface-2); color: var(--text-2);
  font-family: var(--font-body); font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all .2s;
}
.toggle-missing-btn.active {
  background: var(--primary-dim); color: var(--primary); border-color: var(--primary);
}
.deck-cards-list { display: flex; flex-direction: column; gap: 6px; }
.deck-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); transition: all .2s;
}
.deck-row.complete { border-color: rgba(16,185,129,.2); background: rgba(16,185,129,.04); }
.deck-row-check { cursor: pointer; flex-shrink: 0; }
.deck-row-info { flex: 1; min-width: 0; }
.deck-row-name { display: block; font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck-row-name.owned-text { color: var(--green); }

.coll-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.coll-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.coll-list { display: flex; flex-direction: column; }
.coll-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0;
}
.coll-row + .coll-row { border-top: 1px solid var(--border); }
.coll-row.sub-row { padding: 8px 0 8px 16px; }
.coll-row-info { flex: 1; min-width: 0; }
.coll-row-name { display: block; font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coll-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 6px;
  border-top: 1px solid var(--border);
}
.coll-group-name { font-size: 13px; font-weight: 800; color: var(--text); }
.set-code-pill {
  font-family: var(--font-mono); font-size: 11px;
  background: var(--surface-3); color: var(--primary);
  border: 1px solid var(--border-2); border-radius: 5px;
  padding: 2px 7px;
}

.pokedex-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
}
@media(min-width:420px) { .pokedex-grid { grid-template-columns: 1fr 1fr 1fr; } }
@media(min-width:600px) { .pokedex-grid { grid-template-columns: 1fr 1fr 1fr 1fr; } }
.pokedex-slot {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 10px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; transition: all .2s;
}
.pokedex-slot:hover { border-color: var(--border-2); background: var(--surface-2); }
.pokedex-slot.done    { border-color: rgba(16,185,129,.3); background: rgba(16,185,129,.04); }
.pokedex-slot.manual  { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.04); }
.pdex-check { flex-shrink: 0; }
.pdex-info { min-width: 0; }
.pdex-no { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--text-3); }
.pdex-name { display: block; font-size: 11px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pdex-linked { display: block; font-size: 9px; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 50; display: flex; align-items: flex-end;
  backdrop-filter: blur(4px);
}
.modal-sheet {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  width: 100%; max-height: 85vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: var(--shadow-lg);
}
@media(min-width:600px) {
  .modal-overlay { align-items: center; padding: 16px; }
  .modal-sheet { border-radius: 20px; max-width: 520px; margin: auto; }
}
.modal-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 16px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.modal-title { font-size: 15px; font-weight: 900; color: var(--text); }
.modal-actions { display: flex; gap: 6px; }
.modal-search { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-list { overflow-y: auto; flex: 1; padding: 8px 12px; }
.modal-card {
  display: flex; align-items: center; gap: 10px; padding: 10px;
  border-radius: var(--radius-sm); cursor: pointer; transition: background .15s;
}
.modal-card:hover { background: var(--surface-2); }
.modal-card.linked { background: var(--green-dim); }
.modal-card-info { flex: 1; min-width: 0; }
.modal-card-name { display: block; font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 48px 16px; text-align: center;
}
.empty-state.compact { padding: 24px 16px; }
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
.empty-title { font-size: 15px; font-weight: 800; color: var(--text-2); margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--text-3); }

#toast {
  position: fixed; bottom: 88px; right: 16px; z-index: 99;
  padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-lg);
  transition: all .3s; opacity: 0; transform: translateY(10px); pointer-events: none;
  font-family: var(--font-body);
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.success { background: #064e3b; color: var(--green); border: 1px solid rgba(16,185,129,.3); }
#toast.error   { background: #450a0a; color: var(--red); border: 1px solid rgba(239,68,68,.3); }
@media(min-width:600px) { #toast { bottom: 24px; } }

.mt-6  { margin-top: 6px; }
.mt-8  { margin-top: 8px; }
.mt-10 { margin-top: 10px; }
.mt-12 { margin-top: 12px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.ml-4  { margin-left: 4px; }
.ml-6  { margin-left: 6px; }
.ml-auto { margin-left: auto; }
.flex-gap { display: flex; align-items: center; gap: 6px; }
.text-sm   { font-size: 12px; }
.text-muted { color: var(--text-2); }
.mono-sm   { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
.owned-text { color: var(--green) !important; }

.spinner {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; font-size: 14px; color: var(--text-3);
  font-family: var(--font-body);
}

/* sets loading state */
.sets-loading {
  display: flex; flex-direction: column; align-items: center;
  gap: 12px; padding: 32px 16px; color: var(--text-3);
  font-size: 13px; font-weight: 700;
}
.sets-loading-bar {
  width: 120px; height: 4px; background: var(--surface-3);
  border-radius: 99px; overflow: hidden;
}
.sets-loading-fill {
  height: 100%; width: 40%; background: var(--primary);
  border-radius: 99px;
  animation: loading-slide 1s ease-in-out infinite alternate;
}
@keyframes loading-slide {
  from { transform: translateX(-100%); }
  to   { transform: translateX(250%); }
}

[data-theme="light"] {
  --bg:          #f0f4f8;
  --surface:     #ffffff;

  width: 36px; height: 36px; border-radius: 10px;

}

function fmtDate(iso){
  if(!iso)return'';
  const [y,m,d]=iso.split('-');
  const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return d+' '+months[parseInt(m,10)-1]+' '+y;
}

  document.documentElement.setAttribute('data-theme', saved);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';

  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ptcg_theme', next);
  render();
}

function hasNativeBridge() {
  return typeof window.AndroidStorage !== 'undefined';
}
function nativeGet(key) {
  try { return window.AndroidStorage.load(key); } catch(e) { return null; }
}
function nativeSet(key, value) {
  try { window.AndroidStorage.save(key, value); } catch(e) {}
}

function loadStorage() {
  try {
    if (hasNativeBridge()) {
      const d = nativeGet('tcg_decks');
      const c = nativeGet('tcg_collection');
      const p = nativeGet('tcg_pokedex');
      if (d) state.decks = JSON.parse(d);
      if (c) state.collection = JSON.parse(c);
      if (p) state.pokedex151 = JSON.parse(p);
      const j2 = nativeGet('tcg_pokedex_johto'); if (j2) state.pokedexJohto = JSON.parse(j2);
      const h3 = nativeGet('tcg_pokedex_hoenn'); if (h3) state.pokedexHoenn = JSON.parse(h3);
      if (!d && !c) {
        const ld = localStorage.getItem('tcg_decks');
        const lc = localStorage.getItem('tcg_collection');
        const lp = localStorage.getItem('tcg_pokedex');
        if (ld) { state.decks = JSON.parse(ld); nativeSet('tcg_decks', ld); }
        if (lc) { state.collection = JSON.parse(lc); nativeSet('tcg_collection', lc); }
        if (lp) { state.pokedex151 = JSON.parse(lp); nativeSet('tcg_pokedex', lp); }
      }
    } else {
      const d = localStorage.getItem('tcg_decks');
      const c = localStorage.getItem('tcg_collection');
      const p = localStorage.getItem('tcg_pokedex');
      if (d) state.decks = JSON.parse(d);
      if (c) state.collection = JSON.parse(c);
      if (p) state.pokedex151 = JSON.parse(p);
      const j2ls = localStorage.getItem('tcg_pokedex_johto'); if (j2ls) state.pokedexJohto = JSON.parse(j2ls);
      const h3ls = localStorage.getItem('tcg_pokedex_hoenn'); if (h3ls) state.pokedexHoenn = JSON.parse(h3ls);
    }
  } catch(e) { console.error('loadStorage error:', e); }

  Object.values(state.collection).forEach(card => {
    if (card && card.id && !card.id.startsWith('MANUAL_')) {
      syncCollectionToPokedex(card);
    }
  });
}

function saveStorage() {
  try {
    const decksJson   = JSON.stringify(state.decks);
    const collJson    = JSON.stringify(state.collection);
    const pokedexJson = JSON.stringify(state.pokedex151);
    const johtoJson   = JSON.stringify(state.pokedexJohto || {});
    const hoennJson   = JSON.stringify(state.pokedexHoenn || {});
    if (hasNativeBridge()) {
      nativeSet('tcg_decks', decksJson);
      nativeSet('tcg_collection', collJson);
      nativeSet('tcg_pokedex', pokedexJson);
      nativeSet('tcg_pokedex_johto', johtoJson);
      nativeSet('tcg_pokedex_hoenn', hoennJson);
    } else {
      localStorage.setItem('tcg_decks', decksJson);

function genId() {
  return (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseInput(text) {
  let invalid = 0;
  const SKIP_PATTERNS = /^(pok[eé]mon|treinador|energia|trainer|energy|total|\/\/).*/i;
  const cards = text.split('\n').map(l=>l.trim()).filter(Boolean).reduce((acc, line) => {
    if (SKIP_PATTERNS.test(line)) return acc;
    const parts = line.split(/\s+/);
    if (parts.length < 3) { invalid++; return acc; }
    let qty = 1;
    if (!isNaN(parseInt(parts[0],10))) qty = Math.max(1, parseInt(parts.shift(),10));
    const number = parts.pop();
    const set = parts.pop();
    const name = parts.join(' ');
    if (!name || !set || !number) { invalid++; return acc; }
    const numPadded = number.padStart(3, '0');
    const rawCard = { id: `${set}_${numPadded}`, qty, name, set, number: numPadded };
    acc.push(resolveCardName(rawCard));
    return acc;
  }, []);
  return { cards, invalidCount: invalid };
}

function resolveCardName(card) {
  if (!card || !card.id) return card;
  for (const s of SET_COLLECTIONS) {
    const found = s.cards.find(c => c.id === card.id);
    if (found && found.name !== card.name) return { ...card, name: found.name };
  }
  if (card.set && card.number) {
    const padded = card.set + '_' + card.number.padStart(3,'0');
    const unpadded = card.set + '_' + (parseInt(card.number,10) || 0).toString();
    for (const s of SET_COLLECTIONS) {
      let found = s.cards.find(c => c.id === padded) || s.cards.find(c => c.id === unpadded);
      if (found) return { ...card, id: found.id, name: found.name, number: found.number };
    }
  }
  return card;
}

function getOwnedQty(card) {
  const exact = state.collection[card.id]?.qty || 0;
  if (exact > 0) return exact;
  if (card.id) {
    const parts = card.id.split('_');
    if (parts.length === 2) {
      const altNum = parts[1].replace(/^0+/, '') || '0';
      const altNumPad = parts[1].padStart(3, '0');
      const alt1 = state.collection[parts[0] + '_' + altNum]?.qty || 0;
      if (alt1 > 0) return alt1;
      const alt2 = state.collection[parts[0] + '_' + altNumPad]?.qty || 0;
      if (alt2 > 0) return alt2;
    }
  }
  if (!card.name) return 0;
  const nameLower = card.name.toLowerCase().trim();
  return Object.values(state.collection).reduce((sum, c) => {
    if (c.name && c.name.toLowerCase().trim() === nameLower) return sum + (c.qty || 0);
    return sum;
  }, 0);
}

function calcProgress(deckCards) {
  if (!deckCards || !deckCards.length) return 0;
  const total = deckCards.reduce((a,c)=>a+c.qty,0);
  const owned = deckCards.reduce((a,c)=>a+Math.min(getOwnedQty(c), c.qty),0);
  return total===0?0:Math.floor((owned/total)*100);
}
function calcMissing(deckCards) {
  if (!deckCards || !deckCards.length) return 0;
  return deckCards.reduce((a,c)=>a+Math.max(0, c.qty-getOwnedQty(c)), 0);
}
function updateCollectionQty(card, delta, exact=null) {
  const cur = state.collection[card.id]?.qty || 0;
  let next = exact !== null ? exact : cur + delta;
  if (next < 0) next = 0;
  if (next === 0) {
    delete state.collection[card.id];
  } else {
    state.collection[card.id] = { ...card, qty: next };
    if (cur === 0) syncCollectionToPokedex(card);
  }
  saveStorage();
  render();
}
function allDecks() { return [...state.decks, ...PRESET_DECKS]; }
function selectedDeck() {
  if (!state.selectedDeckId) return null;
  return allDecks().find(d => d.id === state.selectedDeckId) || null;
}
function openCardPage(set, number) {
  const num = parseInt(number, 10) || number;
  const url = 'https://limitlesstcg.com/cards/pt/' + set + '/' + num;
  if (window.AndroidBrowser) {
    window.AndroidBrowser.open(url);
  } else {
    window.open(url, '_blank');
  }
}
function copyDeck(deck) {
  const txt = deck.cards.map(c=>`${c.qty} ${c.name} ${c.set} ${c.number}`).join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(()=>showToast(`Deck "${deck.name}" copiado!`)).catch(()=>fallbackCopy(txt,deck.name));
  } else { fallbackCopy(txt, deck.name); }
}
function fallbackCopy(txt, name) {
  const el = document.createElement('textarea');
  el.value = txt; el.style.position='fixed'; el.style.opacity='0';
  document.body.appendChild(el); el.focus(); el.select();
  try { document.execCommand('copy'); showToast(`Deck "${name}" copiado!`); }
  catch { showToast('Erro ao copiar.','error'); }
  document.body.removeChild(el);
}

  };

  }
}

function processCSVText(csvText) {
  try {
    // ── Try JSON backup first (v2 format with Pokédex) ────────────
    const trimmed = csvText.trim();
    if (trimmed.startsWith('{')) {
      const backup = JSON.parse(trimmed);
      // Restore collection
      if (backup.collection && typeof backup.collection === 'object') {
        const newColl = { ...state.collection };
        let count = 0;
        Object.values(backup.collection).forEach(c => {
          if (c.id && c.qty > 0) { newColl[c.id] = c; count++; }
        });
        state.collection = newColl;
      }
      // Restore Pokédex Gen 1
      if (backup.pokedex151 && typeof backup.pokedex151 === 'object') {
        Object.assign(state.pokedex151, backup.pokedex151);
      }
      // Restore Pokédex Gen 2
      if (backup.pokedexJohto && typeof backup.pokedexJohto === 'object') {
        if (!state.pokedexJohto) state.pokedexJohto = {};
        Object.assign(state.pokedexJohto, backup.pokedexJohto);
      }
      // Restore Pokédex Gen 3
      if (backup.pokedexHoenn && typeof backup.pokedexHoenn === 'object') {
        if (!state.pokedexHoenn) state.pokedexHoenn = {};
        Object.assign(state.pokedexHoenn, backup.pokedexHoenn);
      }
      saveStorage();
      const cardCount = Object.keys(state.collection).length;
      const pdCount = Object.keys(state.pokedex151).length +
                      Object.keys(state.pokedexJohto||{}).length +
                      Object.keys(state.pokedexHoenn||{}).length;
      showToast(`${cardCount} cartas + ${pdCount} Pokédex restaurados!`);
      render();
      return;
    }

    // ── Legacy CSV format (collection only) ───────────────────────
    const lines = csvText.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return showToast('Arquivo vazio.', 'error');
    const start = lines[0].toLowerCase().startsWith('id,') ? 1 : 0;
    let imported = 0, skipped = 0;
    const newCollection = { ...state.collection };
    lines.slice(start).forEach(line => {
      const cols = [];
      let cur = '', inQuote = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuote = !inQuote; }
        else if (ch === ',' && !inQuote) { cols.push(cur); cur = ''; }
        else { cur += ch; }
      }
      cols.push(cur);
      if (cols.length < 5) { skipped++; return; }
      const id = cols[0].trim(), name = cols[1].trim(), set = cols[2].trim(), number = cols[3].trim();
      const qty = parseInt(cols[4], 10);
      if (!id || !name || !set || !number || isNaN(qty) || qty < 1) { skipped++; return; }
      const rawImported = { id: id.trim(), name: name.trim(), set: set.trim(), number: number.trim(), qty };
      const resolved = resolveCardName(rawImported);
      const existing = newCollection[resolved.id];
      newCollection[resolved.id] = { ...resolved, qty: existing ? Math.max(existing.qty, qty) : qty };
      imported++;
    });
    if (!imported) return showToast('Nenhuma carta válida encontrada.', 'error');
    state.collection = newCollection;
    saveStorage();
    const msg = imported + ' carta' + (imported!==1?'s':'') + ' importada' +
                (imported!==1?'s':'') + (skipped>0?' ('+skipped+' ignoradas)':'') + '!';
    showToast(msg);
    render();
  } catch(err) {
    showToast('Erro ao processar arquivo.', 'error');
  }
}

function importCollectionCSV(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => processCSVText(e.target.result);
  reader.readAsText(file, 'utf-8');
}

window.onCSVImported = function(base64) {
  try {
    const csvText = decodeURIComponent(escape(atob(base64)));
    processCSVText(csvText);
  } catch(e) { processCSVText(base64); }
};

function processDeckImportText(jsonText) {
  try {
    const data = JSON.parse(jsonText);
    const imported = Array.isArray(data) ? data : (data.decks || []);
    if (!imported.length) return showToast('Nenhum deck encontrado no arquivo.', 'error');
    let added = 0, skipped = 0;
    imported.forEach(deck => {
      if (!deck.name || !Array.isArray(deck.cards)) { skipped++; return; }
      // Avoid duplicates by name
      if (state.decks.some(d => d.name === deck.name)) { skipped++; return; }
      state.decks.push({
        id: genId(),
        name: deck.name,
        description: deck.description || '',
        cards: deck.cards,
        createdAt: deck.createdAt || Date.now()
      });
      added++;
    });
    if (!added) return showToast('Todos os decks já existem (mesmo nome).', 'error');
    saveStorage();
    showToast(added + ' deck(s) importado(s)!' + (skipped > 0 ? ' (' + skipped + ' ignorado(s))' : ''));
    render();
  } catch(e) {
    showToast('Arquivo inválido. Use um JSON exportado pelo app.', 'error');
  }
}

function importDecks() {
  if (typeof window.AndroidExport !== 'undefined') {
    // Android: reutiliza o picker nativo (o callback onCSVImported receberá o JSON)
    window._deckImportMode = true;
    window.AndroidExport.pickCSV();
  } else {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => processDeckImportText(ev.target.result);
      reader.readAsText(file, 'utf-8');
    };
    inp.click();
  }
}

// Override onCSVImported to route to deck import if flagged
const _origOnCSVImported = window.onCSVImported;
window.onCSVImported = function(base64) {
  try {
    const text = decodeURIComponent(escape(atob(base64)));
    if (window._deckImportMode) {
      window._deckImportMode = false;
      processDeckImportText(text);
    } else {
      processCSVText(text);
    }
  } catch(e) {
    window._deckImportMode = false;
    processCSVText(base64);
  }
};

  document.getElementById('app').innerHTML = buildApp();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (activeStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(activeStart, activeEnd); } catch(e) {}
      }
    }
  }
}

function buildApp() {
  return `${buildHeader()}<main id="main-content">${buildMain()}</main>${buildBottomNav()}${buildPokedexModal()}`;
}

function buildHeader() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  return `<header class="app-header">
    <div class="header-inner">
      <div class="header-logo">
        <span class="logo-bolt">${icon("zap",16)}</span>
        <span class="logo-text">PTCG<span class="logo-accent">Collector</span></span>
      </div>
      <nav class="header-nav">
        ${[['decks','Decks','cards'],['league','Pool','swords'],['collection','Coleção','archive']].map(([id,label,ic]) =>
          `<button class="hnav-btn ${state.tab===id?'active':''}" data-nav="${id}">${icon(ic,15)} ${label}</button>`
        ).join('')}
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
        ${isDark ? icon('sun',17) : icon('moon',17)}
      </button>
    </div>
  </header>`;
}

function buildBottomNav() {
  const tabs = [
    { id:'decks',      iconName:'cards',   label:'DECKS'  },
    { id:'league',     iconName:'swords',  label:'POOL'   },

  return `<nav class="bottom-nav">
    ${tabs.map(t => `

function buildMain() {
  const deck = selectedDeck();
  if (deck) return buildDeckDetail(deck);
  if (state.tab === 'decks')      return buildDecksTab();
  if (state.tab === 'league')     return buildLeagueTab();
  if (state.tab === 'collection') return buildCollectionTab();
  return '';
}

  const filtered = LEAGUE_POOL.filter(c => {
    const ft = state.poolFilter==='todos' || c.type===state.poolFilter;
    const fs = !state.poolSearch || c.name.toLowerCase().includes(state.poolSearch.toLowerCase());
    return ft && fs;
  });
  let html = `<div class="search-row mb-8">
    <input class="inp inp-search" id="pool-search" placeholder="Buscar carta..." value="${esc(state.poolSearch)}" oninput="state.poolSearch=this.value;render()">
  </div>

    ${filters.map(f=>`<button class="chip ${state.poolFilter===f?'active':''}" data-pool-filter="${f}">${f==='todos'?'Todos':f}</button>`).join('')}
  </div>
  <p class="count-label mb-8">${filtered.length} carta${filtered.length!==1?'s':''}</p>
  <div class="card-list">`;
  filtered.forEach(card => {
    const owned = getOwnedQty(card);
    const collCard = { id: card.id, name: card.name, set: card.id.split('_')[0], number: card.id.split('_')[1] };
    html += `<div class="list-card ${owned>0?'owned':''}">
      <div class="list-card-header">
        <div class="list-card-meta">
          <span class="list-card-name">${esc(card.name)}</span>
          <span class="badge ${typeColor[card.type]||'badge-dim'}">${esc(card.type)}</span>
          ${card.hp?`<span class="badge badge-dim">${card.hp}PS · ${esc(card.pokemonType)}</span>`:''}
        </div>
        <div class="counter-group">
          <button class="counter-btn" ${owned<=0?'disabled':''} data-pool-card="${encodeURIComponent(JSON.stringify(collCard))}" data-delta="-1">−</button>
          <span class="counter-val ${owned>0?'active':''}">${owned}</span>
          <button class="counter-btn" data-pool-card="${encodeURIComponent(JSON.stringify(collCard))}" data-delta="1">+</button>
        </div>
      </div>
      <div class="print-chips">
        ${card.prints.map(p=>{ const pts=p.split(' '); const s=pts[0]; const n=(pts[1]||'').replace('#','');
          return `<span class="print-chip" onclick="openCardPage('${s}','${n}')">${esc(p)}</span>`;
        }).join('')}
      </div>
      <p class="list-card-desc">${esc(card.desc)}</p>
    </div>`;
  });
  if (!filtered.length) html += `<div class="empty-state compact"><p>Nenhuma carta encontrada.</p></div>`;
  html += `</div>`;
  return html;
}

function buildLeagueSets() {
  if (state.selectedSet === '__pokedex__') return buildPokedexView();

  if (!state.selectedSet) {
    const seriesFilter = state.seriesFilter || 'Todos';
    const pdLinked = Object.keys(state.pokedex151).length;
    const pdPct = Math.floor((pdLinked/151)*100);

    // Filter + sort sets
    const allSeries = ['Todos','Pokédex','Mega','Scarlet & Violet'];
    const sortedSets = [...SET_COLLECTIONS].sort((a,b)=>{
      const da = SET_RELEASE_DATES[a.sigla]||'0000';
      const db = SET_RELEASE_DATES[b.sigla]||'0000';
      return db.localeCompare(da);
    });

    // Group by series for display
    const seriesGroups = {};
    sortedSets.forEach(s => {
      const ser = SET_SERIES[s.sigla] || 'Outros';
      if (!seriesGroups[ser]) seriesGroups[ser] = [];
      seriesGroups[ser].push(s);
    });

    const showSeries = seriesFilter === 'Todos'
      ? ['Mega','Scarlet & Violet']
      : seriesFilter === 'Pokédex' ? [] : [seriesFilter];

    // Pokédex tracker always visible
    const showPokedex = seriesFilter === 'Todos' || seriesFilter === 'Pokédex';

    const gridType = state.gridTypeFilter || 'master';

    let html = `<div class="chip-row mb-8">
      ${allSeries.map(s=>`<button class="chip ${seriesFilter===s?'active':''}" onclick="state.seriesFilter='${s}';render()">${s}</button>`).join('')}
    </div>
    <div class="type-filter-row mb-12">
      <button onclick="state.gridTypeFilter='basic';render()" class="type-btn ${gridType==='basic'?'active-purple':''}">
        ${icon("circle",13)} Básico<br><span class="type-sub">sem secret</span>
      </button>
      <button onclick="state.gridTypeFilter='complete';render()" class="type-btn ${gridType==='complete'?'active-blue':''}">
        ${icon("diamond",13)} Completo<br><span class="type-sub">+ rev. holo</span>
      </button>
      <button onclick="state.gridTypeFilter='master';render()" class="type-btn ${gridType==='master'?'active-gold':''}">
        ${icon("crown",13)} Mestre<br><span class="type-sub">tudo</span>
      </button>
    </div>`;

    if (showPokedex) {
      // Gen2 stats
      if (!state.pokedexJohto) state.pokedexJohto = {};
      const pdJohtoLinked = Object.keys(state.pokedexJohto).length;
      const pdJohtoPct = Math.floor((pdJohtoLinked/100)*100);

      if (!state.pokedexHoenn) state.pokedexHoenn = {};
      const pdHoennLinked = Object.keys(state.pokedexHoenn).length;
      const pdHoennPct = Math.floor((pdHoennLinked/135)*100);

      html += `<div class="sets-series-label">Pokédex</div>
        <div class="sets-grid mb-12">
          <div class="set-card pokedex-card" onclick="state.selectedSet='__pokedex__';state.pokedexGen=1;render()" style="border-color:rgba(239,68,68,.3)">
            <div class="set-card-header">
              <div>
                <div class="set-card-name">Kanto — Gen I</div>
                <div style="display:flex;gap:4px;align-items:center;margin-top:2px;">
                  <span class="badge badge-red mono-sm">#001–151</span>
                </div>
              </div>
              <span class="set-card-count">${pdLinked}/151</span>
            </div>
            <div class="progress-track mt-8"><div class="progress-fill red" style="width:${pdPct}%"></div></div>
            <div class="set-card-pct">${pdPct}%</div>
          </div>
          <div class="set-card pokedex-card" onclick="state.selectedSet='__pokedex__';state.pokedexGen=2;render()" style="border-color:rgba(245,158,11,.3)">
            <div class="set-card-header">
              <div>
                <div class="set-card-name">Johto — Gen II</div>
                <div style="display:flex;gap:4px;align-items:center;margin-top:2px;">
                  <span class="badge badge-amber mono-sm">#152–251</span>
                </div>
              </div>
              <span class="set-card-count">${pdJohtoLinked}/100</span>
            </div>
            <div class="progress-track mt-8"><div class="progress-fill gold" style="width:${pdJohtoPct}%"></div></div>
            <div class="set-card-pct">${pdJohtoPct}%</div>

              <div>

                <div style="display:flex;gap:4px;align-items:center;margin-top:2px;">

              <span class="set-card-count">${pdHoennLinked}/135</span>

            <div class="progress-track mt-8"><div class="progress-fill blue" style="width:${pdHoennPct}%"></div></div>
            <div class="set-card-pct">${pdHoennPct}%</div>
          </div>
        </div>`;
    }

    showSeries.forEach(serName => {
      const sets = seriesGroups[serName] || [];
      if (!sets.length) return;

      html += `<div class="sets-series-label">${serName}</div>

      sets.forEach(s => {
        const thresh = SET_THRESHOLDS[s.sigla] || {basic: s.cards.length, complete: s.cards.length};
        const typeLimit = gridType==='basic' ? thresh.basic
                        : gridType==='complete' ? thresh.complete
                        : s.cards.length;
        const scopeCards = s.cards.filter(c => parseInt(c.number,10) <= typeLimit);
        const total = scopeCards.length;

  });

    const scope = mode==='owned'?filteredByType.filter(c=>(state.collection[c.id]?.qty||0)>0)
                : mode==='missing'?filteredByType.filter(c=>(state.collection[c.id]?.qty||0)===0)
                : filteredByType;
    const csv = ['number,set,name,qty,status',...scope.map(c=>{
      const qty=state.collection[c.id]?.qty||0;
      return [c.number,c.set,'"'+c.name.replace(/"/g,'""')+'"',qty,qty>0?'possui':'faltando'].join(',');
    })].join('\n');
    const filename = s.sigla+'-'+mode+'-'+new Date().toISOString().slice(0,10)+'.csv';
    if (typeof window.AndroidExport!=='undefined') { window.AndroidExport.shareCSV(filename,csv); }
    else { const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u); }
    showToast(scope.length+' cartas exportadas!');
  };
  window._exportSetCSV = exportSetCSV;

  const relDate = fmtDate(SET_RELEASE_DATES[s.sigla]);
  let html = `<div class="detail-header">
    <button class="btn-back" id="btn-back-sets">${icon("back",16)} Voltar</button>
    <div class="detail-title-row">
      <span class="detail-title">${esc(s.name)}</span>
      <span class="badge badge-dim mono-sm">${s.sigla}</span>
      ${relDate?`<span class="mono-sm" style="color:var(--text-3);font-size:10px">${relDate}</span>`:''}
    </div>
    <span class="detail-count">${typeOwnedCount}/${filteredByType.length}</span>
  </div>
  <div class="type-filter-row mb-8">
    <button onclick="state.setTypeFilter='basic';render()" class="type-btn ${state.setTypeFilter==='basic'?'active-purple':''}">
      ${icon("circle",13)} Básico<br><span class="type-sub">sem secret</span>
    </button>
    <button onclick="state.setTypeFilter='complete';render()" class="type-btn ${state.setTypeFilter==='complete'?'active-blue':''}">
      ${icon("diamond",13)} Completo<br><span class="type-sub">+ rev. holo</span>
    </button>
    <button onclick="state.setTypeFilter='master';render()" class="type-btn ${state.setTypeFilter==='master'?'active-gold':''}">
      ${icon("crown",13)} Mestre<br><span class="type-sub">tudo</span>
    </button>
  </div>
  <div class="progress-track mb-8"><div class="progress-fill green glow" style="width:${typePct}%"></div></div>
  <div class="status-filter-row mb-12">
    <button onclick="state.setStatusFilter='all';render()" class="status-btn ${state.setStatusFilter==='all'?'active':''}">Todas (${filteredByType.length})</button>
    <button onclick="state.setStatusFilter='owned';render()" class="status-btn green ${state.setStatusFilter==='owned'?'active':''}">${icon("check",11)} Possui (${typeOwnedCount})</button>
    <button onclick="state.setStatusFilter='missing';render()" class="status-btn red ${state.setStatusFilter==='missing'?'active':''}">${icon("x",11)} Falta (${typeMissingCount})</button>
  </div>
  <div class="export-row mb-12">
    <button onclick="window._exportSetCSV('all')" class="btn-pill btn-ghost btn-xs">${icon("upload",13)} Todas</button>
    <button onclick="window._exportSetCSV('owned')" class="btn-pill btn-ghost btn-xs green-txt">${icon("upload",13)} Possui</button>
    <button onclick="window._exportSetCSV('missing')" class="btn-pill btn-ghost btn-xs red-txt">${icon("upload",13)} Faltantes</button>
  </div>
  <input class="inp inp-search mb-12" id="set-search" placeholder="Buscar carta no set..." value="${esc(state.setSearch)}" oninput="state.setSearch=this.value;render()">
  <div class="set-card-list">`;

  filtered.forEach(card => {
    const qty = state.collection[card.id]?.qty||0;
    html += `<div class="set-row ${qty>0?'owned':''}">
      <div class="set-row-check">
        <div class="checkbox ${qty>0?'checked':''}">${qty>0?icon('check',13):''}</div>
      </div>
      <div class="set-row-info">
        <span class="set-row-name ${qty>0?'owned-text':''}">${esc(card.name)}</span>
        <span class="set-row-code mono-sm">
          ${card.set} #${card.number}
          <span onclick="openCardPage('${card.set}','${card.number}')" class="ver-link">${icon("external",12)}</span>
        </span>
      </div>
      <div class="counter-group">
        <button class="counter-btn" ${qty<=0?'disabled':''} data-set-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="-1">−</button>
        <span class="counter-val ${qty>0?'active':''}">${qty}</span>
        <button class="counter-btn" data-set-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="1">+</button>
      </div>
    </div>`;
  });
  if (!filtered.length) html += `<div class="empty-state compact"><p>Nenhuma carta encontrada.</p></div>`;
  html += `</div>`;
  return html;
}

// ── COLLECTION TAB ─────────────────────────────

  const knownSets = [...new Set(allCards.map(c=>c.set).filter(Boolean))].sort();
  const filtered = allCards.filter(card => {
    const ms = !state.collSearch || card.name.toLowerCase().includes(state.collSearch.toLowerCase());
    const mset = state.collSetFilter==='todos' || card.set===state.collSetFilter;
    return ms && mset;
  });

  filtered.forEach(card => {

  const groupKeys = Object.keys(grouped).sort();

  html += `<div class="surface-card">

        <span class="badge badge-dim">${filtered.length}/${allCards.length}</span>

    </div>
    <div class="search-filters mt-10">
      <input class="inp inp-search" id="coll-search" placeholder="Buscar por nome..." value="${esc(state.collSearch)}" oninput="state.collSearch=this.value;render()">
      <select class="inp select-inp mt-8" id="coll-set-filter" onchange="state.collSetFilter=this.value;render()">
        <option value="todos" ${state.collSetFilter==='todos'?'selected':''}>Todos os sets</option>
        ${knownSets.map(s=>`<option value="${s}" ${state.collSetFilter===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="coll-list mt-12">`;

  if (!allCards.length) {
    html += `<div class="empty-state compact"><div class="empty-icon">${icon("archive",40)}</div><p>Nenhuma carta ainda.</p></div>`;
  } else if (!groupKeys.length) {
    html += `<div class="empty-state compact"><p>Nenhuma carta encontrada.</p></div>`;
  } else {
    groupKeys.forEach(key => {
      const group = grouped[key];
      const totalQty = group.reduce((s,c)=>s+c.qty,0);
      const isMulti = group.length > 1;
      if (isMulti) {
        html += `<div class="coll-group-header">
          <div>
            <span class="coll-group-name">${esc(group[0].name)}</span>
            <span class="badge badge-dim ml-6">${group.length} versões · ${totalQty}x</span>
          </div>
        </div>`;
        group.forEach(card => {
          html += `<div class="coll-row sub-row">
            <span class="set-code-pill">${esc(card.set)} #${esc(card.number)}</span>
            <span onclick="openCardPage('${card.set}','${card.number}')" class="ver-link ml-4">${icon('external',12)}</span>
            <div class="counter-group ml-auto">
              <button class="counter-btn" ${card.qty<=0?'disabled':''} data-coll-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="-1">−</button>
              <span class="counter-val ${card.qty>0?'active':''}">${card.qty}</span>
              <button class="counter-btn" data-coll-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="1">+</button>
            </div>
          </div>`;
        });
      } else {
        const card = group[0];
        html += `<div class="coll-row">
          <div class="coll-row-info">
            <span class="coll-row-name">${esc(card.name)}</span>
            <span class="mono-sm text-muted">${esc(card.set)} #${esc(card.number)}
              <span onclick="openCardPage('${card.set}','${card.number}')" class="ver-link">${icon("external",12)}</span>
            </span>
          </div>
          <div class="counter-group">
            <button class="counter-btn" ${card.qty<=0?'disabled':''} data-coll-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="-1">−</button>
            <span class="counter-val ${card.qty>0?'active':''}">${card.qty}</span>
            <button class="counter-btn" data-coll-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="1">+</button>
          </div>
        </div>`;
      }
    });
  }
  html += `</div></div>`;
  return html;
}

// ── DECK DETAIL ────────────────────────────────
function buildDeckDetail(deck) {
  const pct = calcProgress(deck.cards);
  const missing = calcMissing(deck.cards);
  const isPreset = PRESET_DECKS.some(p=>p.id===deck.id);
  const cardsToShow = state.showMissingOnly
    ? deck.cards.filter(c=>getOwnedQty(c)<c.qty)
    : deck.cards;

  let html = `<div class="detail-header">
    <button class="btn-back" id="btn-back-deck">${icon("back",16)} Voltar</button>
    <div class="detail-title-row">
      <span class="detail-title">${esc(deck.name)}</span>
      ${isPreset?'<span class="badge badge-amber">Liga</span>':''}
    </div>
    <button class="btn-pill btn-ghost btn-xs" id="btn-copy-deck">${icon("copy",14)} Copiar</button>
  </div>
  ${deck.description?`<p class="deck-desc">${esc(deck.description)}</p>`:''}
  <div class="deck-stats mb-12">
    <div class="progress-track"><div class="progress-fill blue glow" style="width:${pct}%"></div></div>
    <div class="deck-stats-row">
      <span class="text-muted text-sm">${pct}% completo</span>
      <div class="flex-gap">
        ${missing>0?`<span class="badge badge-red">Faltam ${missing}</span>`:`<span class="badge badge-green">${icon('check',10)} Completo</span>`}
        <span class="badge badge-dim">${deck.cards.reduce((a,c)=>a+c.qty,0)} cartas</span>
      </div>
    </div>
  </div>
  <button id="btn-toggle-missing" class="toggle-missing-btn ${state.showMissingOnly?'active':''}">
    ${state.showMissingOnly?icon('eye',15)+' Mostrar todas':icon('eye-off',15)+' Mostrar apenas o que falta'}
  </button>
  <div class="deck-cards-list">`;

  if (state.showMissingOnly && cardsToShow.length===0) {
    html += `<div class="empty-state compact"><div class="empty-icon">${icon("check-sq",40)}</div><p>Você tem todas as cartas!</p></div>`;
  }

  cardsToShow.forEach(card => {
    const owned = getOwnedQty(card);
    const complete = owned >= card.qty;
    html += `<div class="deck-row ${complete?'complete':''}">
      <div class="deck-row-check" data-toggle-card="${encodeURIComponent(JSON.stringify({...card, _complete: complete}))}">
        <div class="checkbox ${complete?'checked':''}">${complete?icon('check',13):''}</div>
      </div>
      <div class="deck-row-info">
        <span class="deck-row-name ${complete?'owned-text':''}">${card.qty}× ${esc(card.name)}</span>
        <span class="mono-sm text-muted">
          ${card.set} #${card.number}
          <span onclick="openCardPage('${card.set}','${card.number}')" class="ver-link">${icon("external",12)}</span>
        </span>
      </div>
      <div class="counter-group">
        <button class="counter-btn" ${owned<=0?'disabled':''} data-deck-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="-1">−</button>
        <span class="counter-val ${owned>=card.qty?'green':owned>0?'amber':'dim'}">${owned}/${card.qty}</span>
        <button class="counter-btn" data-deck-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="1">+</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

// ── POKÉDEX ─────────────────────────────────────
function buildPokedexSlotHTML(pk, cardId, gen) {
  const done = !!cardId;
  const isManual = cardId?.startsWith('MANUAL_');
  let linkedName = '';
  if (cardId && !isManual) {
    for (const s of SET_COLLECTIONS) {
      const f = s.cards.find(c=>c.id===cardId);
      if (f) { linkedName = f.name; break; }
    }
  } else if (isManual) { linkedName = 'Manual'; }
  const onClick = gen === 1 ? `openPokedexSlot(${pk.no})`
                : gen === 2 ? `openPokedexSlotG2(${pk.no})`
                :             `openPokedexSlotG3(${pk.no})`;
  return `<div class="pokedex-slot ${done?(isManual?'manual':'done'):''}" onclick="${onClick}">
    <div class="pdex-check"><div class="checkbox sm ${done?'checked':''} ${isManual?'amber':''}">${done?icon('check',11):''}</div></div>
    <div class="pdex-info">
      <span class="pdex-no">#${String(pk.no).padStart(3,'0')}</span>
      <span class="pdex-name">${pk.name}</span>
      ${linkedName?`<span class="pdex-linked">${linkedName}</span>`:''}
    </div>
  </div>`;
}

function buildPokedexView() {
  const gen = state.pokedexGen || 1;

  if (!state.pokedexJohto) state.pokedexJohto = {};
  if (!state.pokedexHoenn) state.pokedexHoenn = {};

  const linked1 = Object.keys(state.pokedex151).length;
  const linked2 = Object.keys(state.pokedexJohto).length;
  const linked3 = Object.keys(state.pokedexHoenn).length;

  const configs = {
    1: { list: POKEDEX_151,   st: state.pokedex151,   linked: linked1, total: 151, color: 'red',  label: 'Kanto — Gen I'   },
    2: { list: POKEDEX_JOHTO, st: state.pokedexJohto, linked: linked2, total: 100, color: 'gold', label: 'Johto — Gen II'  },
    3: { list: POKEDEX_HOENN, st: state.pokedexHoenn, linked: linked3, total: 135, color: 'blue', label: 'Hoenn — Gen III' },
  };
  const cfg = configs[gen];

  let html = `<div class="detail-header">
    <button class="btn-back" id="btn-back-sets">${icon("back",16)} Voltar</button>
    <div class="detail-title-row">
      <span class="detail-title">Pokédex</span>
      <span class="badge ${gen===1?'badge-red':gen===2?'badge-amber':'badge-blue'}">${cfg.label}</span>
    </div>
    <span class="detail-count">${cfg.linked}/${cfg.total}</span>
  </div>

  <div class="sub-tabs mb-12">
    <button class="sub-tab ${gen===1?'active':''}" onclick="state.pokedexGen=1;render()">Kanto 151</button>
    <button class="sub-tab ${gen===2?'active':''}" onclick="state.pokedexGen=2;render()">Johto 100</button>
    <button class="sub-tab ${gen===3?'active':''}" onclick="state.pokedexGen=3;render()">Hoenn 135</button>
  </div>

  <div class="progress-row mb-8">
    <div class="progress-track" style="flex:1">
      <div class="progress-fill ${cfg.color} glow" style="width:${Math.floor(cfg.linked/cfg.total*100)}%"></div>
    </div>
    <span class="progress-pct">${cfg.linked}/${cfg.total}</span>
  </div>

  <div class="pokedex-grid">`;

  cfg.list.forEach(pk => {
    html += buildPokedexSlotHTML(pk, cfg.st[pk.no], gen);
  });

  html += `</div>`;
  return html;
}

function _buildPokedexModalInner(pk, linkedId, linkFn, unlinkFn, genLabel) {
  const search = state.pokedexModalSearch || pk.search;
  const matches = [];
  for (const s of SET_COLLECTIONS) {
    for (const card of s.cards) {
      if (card.name.toLowerCase().includes(search.toLowerCase())) {
        matches.push({...card, setName: s.name});
      }
    }
  }
  return `<div class="modal-overlay" id="pokedex-modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <span class="modal-title">#${String(pk.no).padStart(3,'0')} ${pk.name}</span>
          ${genLabel!=='Gen I'?`<span class="badge ${genLabel==='Gen II'?'badge-amber':'badge-blue'} ml-6">${genLabel}</span>`:''}
        </div>
        <div class="modal-actions">
          ${linkedId?`<button onclick="${unlinkFn}(${pk.no})" class="btn-pill btn-danger btn-xs">${icon("x",12)} Desvincular</button>`:''}
          <button onclick="closePokedexModal()" class="btn-pill btn-ghost btn-xs">Fechar</button>
        </div>
      </div>
      <div class="modal-search">
        <input class="inp inp-search" id="pokedex-modal-search" value="${esc(search)}" placeholder="Buscar carta..." oninput="state.pokedexModalSearch=this.value;render()">
        <span class="count-label mt-6">${matches.length} carta${matches.length!==1?'s':''}</span>
      </div>
      <div class="modal-list">
        ${matches.length===0
          ? `<div class="empty-state compact">
              <p class="mb-12">Nenhuma carta encontrada.</p>
              <button onclick="${linkFn}(${pk.no},'MANUAL_${pk.no}')" class="btn-pill btn-amber">${icon("edit",13)} Marcar manualmente</button>
            </div>`
          : matches.map(card => {
              const isLinked = card.id===linkedId;
              const inColl = (state.collection[card.id]?.qty||0)>0;
              return `<div onclick="${linkFn}(${pk.no},'${card.id}')" class="modal-card ${isLinked?'linked':''}">
                <div class="checkbox sm ${isLinked?'checked':''}">${isLinked?icon('check',11):''}</div>
                <div class="modal-card-info">
                  <span class="modal-card-name">${esc(card.name)}</span>
                  <span class="mono-sm text-muted">${card.set} #${card.number}</span>
                </div>
                ${inColl?'<span class="badge badge-blue">Na coleção</span>':''}
              </div>`;
            }).join('')
        }
      </div>
    </div>
  </div>`;
}

function buildPokedexModal() {
  if (state.pokedexModal !== null) {
    const pk = POKEDEX_151.find(p=>p.no===state.pokedexModal);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, state.pokedex151[pk.no]||null, 'linkPokedexSlot', 'unlinkPokedexSlot', 'Gen I');
  }
  if (state.pokedexModalG2 !== null && state.pokedexModalG2 !== undefined) {
    const pk = POKEDEX_JOHTO.find(p=>p.no===state.pokedexModalG2);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexJohto||{})[pk.no]||null, 'linkPokedexSlotG2', 'unlinkPokedexSlotG2', 'Gen II');
  }
  if (state.pokedexModalG3 !== null && state.pokedexModalG3 !== undefined) {
    const pk = POKEDEX_HOENN.find(p=>p.no===state.pokedexModalG3);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexHoenn||{})[pk.no]||null, 'linkPokedexSlotG3', 'unlinkPokedexSlotG3', 'Gen III');
  }
  return '';
}

// ─────────────────────────────────────────────
//  EVENTS
// ─────────────────────────────────────────────
function attachEvents() {
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      state.tab = el.dataset.nav;
      state.selectedDeckId = null;
      state.confirmDeleteId = null;
      state.showAddDeck = false;
      state.showMissingOnly = false;
      state.pokedexModal = null;
      state.selectedSet = null;
      render();
    });
  });

  app.querySelectorAll('[data-league-tab]').forEach(el => {
    el.addEventListener('click', () => {
      state.leagueTab = el.dataset.leagueTab || 'pool';
      state.selectedSet = null;
      state.setSearch = '';
      state.seriesFilter = 'Todos';
      state.gridTypeFilter = 'master';
      render();
    });
  });

  app.querySelectorAll('[data-open-deck]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-ask-delete],[data-confirm-delete],[data-cancel-delete]')) return;
      state.selectedDeckId = el.dataset.openDeck;
      render();
    });
  });

  app.querySelectorAll('[data-open-set]').forEach(el => {
    el.addEventListener('click', () => { state.selectedSet = el.dataset.openSet; render(); });
  });

  const backDeck = document.getElementById('btn-back-deck');
  if (backDeck) backDeck.addEventListener('click', () => { state.selectedDeckId = null; state.showMissingOnly = false; render(); });

  const backSets = document.getElementById('btn-back-sets');
  if (backSets) backSets.addEventListener('click', () => { state.selectedSet = null; state.setSearch = ''; state.setStatusFilter = 'all'; state.setTypeFilter = 'master'; render(); });

  const pdOverlay = document.getElementById('pokedex-modal-overlay');
  if (pdOverlay) pdOverlay.addEventListener('click', (e) => {
    if (e.target === pdOverlay) {
      state.pokedexModal = null;
      state.pokedexModalG2 = null;
      state.pokedexModalSearch = '';
      render();
    }
  });

  const btnAddDeck = document.getElementById('btn-add-deck');
  if (btnAddDeck) btnAddDeck.addEventListener('click', () => { state.showAddDeck = !state.showAddDeck; render(); });

  const btnCancelDeck = document.getElementById('btn-cancel-deck');
  if (btnCancelDeck) btnCancelDeck.addEventListener('click', () => {
    state.showAddDeck = false; state.newDeckName=''; state.newDeckDesc=''; state.newDeckList=''; render();
  });

  const btnSaveDeck = document.getElementById('btn-save-deck');
  if (btnSaveDeck) btnSaveDeck.addEventListener('click', () => {
    const name = document.getElementById('inp-deck-name').value.trim();
    const desc = document.getElementById('inp-deck-desc').value.trim();
    const list = document.getElementById('inp-deck-list').value;
    if (!name) return showToast('O deck precisa ter um nome.','error');
    const { cards, invalidCount } = parseInput(list);
    if (invalidCount) showToast(`${invalidCount} linha(s) ignoradas.`,'error');
    if (!cards.length) return showToast('Adicione cartas válidas.','error');
    if (cards.reduce((a,c)=>a+c.qty,0)>60) return showToast('Deck ultrapassa 60 cartas.','error');
    state.decks.push({ id: genId(), name, description: desc, cards, createdAt: Date.now() });
    state.showAddDeck = false; state.newDeckName=''; state.newDeckDesc=''; state.newDeckList='';
    saveStorage(); showToast('Deck salvo!'); render();
  });

  ['inp-deck-name','inp-deck-desc','inp-deck-list'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => {
      if (id==='inp-deck-name') state.newDeckName = el.value;
      if (id==='inp-deck-desc') state.newDeckDesc = el.value;
      if (id==='inp-deck-list') state.newDeckList = el.value;
    });
  });

  app.querySelectorAll('[data-ask-delete]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); state.confirmDeleteId = el.dataset.askDelete; render(); });
  });
  app.querySelectorAll('[data-confirm-delete]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation();
      state.decks = state.decks.filter(d=>d.id!==el.dataset.confirmDelete);
      state.confirmDeleteId = null; saveStorage(); showToast('Deck excluído.'); render();
    });
  });
  const btnCancelDel = app.querySelector('[data-cancel-delete]');
  if (btnCancelDel) btnCancelDel.addEventListener('click', (e) => { e.stopPropagation(); state.confirmDeleteId=null; render(); });

  const btnCopy = document.getElementById('btn-copy-deck');
  if (btnCopy) btnCopy.addEventListener('click', () => { const d=selectedDeck(); if(d) copyDeck(d); });

  const btnToggleMissing = document.getElementById('btn-toggle-missing');
  if (btnToggleMissing) btnToggleMissing.addEventListener('click', () => { state.showMissingOnly = !state.showMissingOnly; render(); });

  app.querySelectorAll('[data-toggle-card]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation();
      const card = JSON.parse(decodeURIComponent(el.dataset.toggleCard));
      updateCollectionQty(card, 0, card._complete ? 0 : card.qty);
    });
  });

  app.querySelectorAll('[data-deck-card]').forEach(el => {
    el.addEventListener('click', () => {
      const card = JSON.parse(decodeURIComponent(el.dataset.deckCard));
      updateCollectionQty(card, parseInt(el.dataset.delta));
    });
  });
  app.querySelectorAll('[data-pool-card]').forEach(el => {
    el.addEventListener('click', () => {
      const card = JSON.parse(decodeURIComponent(el.dataset.poolCard));
      updateCollectionQty(card, parseInt(el.dataset.delta));
    });
  });
  app.querySelectorAll('[data-set-card]').forEach(el => {
    el.addEventListener('click', () => {
      const card = JSON.parse(decodeURIComponent(el.dataset.setCard));
      updateCollectionQty(card, parseInt(el.dataset.delta));
    });
  });
  app.querySelectorAll('[data-coll-card]').forEach(el => {
    el.addEventListener('click', () => {
      const card = JSON.parse(decodeURIComponent(el.dataset.collCard));
      updateCollectionQty(card, parseInt(el.dataset.delta));
    });
  });

  app.querySelectorAll('[data-pool-filter]').forEach(el => {
    el.addEventListener('click', () => { state.poolFilter = el.dataset.poolFilter; render(); });
  });

  const manualEl = document.getElementById('manual-entry');
  if (manualEl) manualEl.addEventListener('input', () => { state.manualEntry = manualEl.value; });

  const btnAddColl = document.getElementById('btn-add-collection');
  if (btnAddColl) btnAddColl.addEventListener('click', () => {
    const text = document.getElementById('manual-entry').value;
    if (!text.trim()) return;
    const { cards, invalidCount } = parseInput(text);
    if (invalidCount) showToast(`${invalidCount} linha(s) ignoradas.`,'error');
    if (!cards.length) return;
    cards.forEach(rawItem => {
      const item = resolveCardName(rawItem);
      const existing = state.collection[item.id];
      const wasZero = !existing || existing.qty === 0;
      state.collection[item.id] = { ...item, qty: (existing?.qty||0) + item.qty };
      if (wasZero) syncCollectionToPokedex(item);
    });
    state.manualEntry = '';
    saveStorage(); showToast('Coleção atualizada!'); render();
  });

  const btnExport = document.getElementById('btn-export-csv');
  if (btnExport) btnExport.addEventListener('click', exportCollectionCSV);

  const btnImport = document.getElementById('btn-import-csv');
  if (btnImport) btnImport.addEventListener('click', () => {
    if (typeof window.AndroidExport !== 'undefined') {
      window.AndroidExport.pickCSV();
    } else {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.csv';
      inp.onchange = (e) => { if (e.target.files[0]) importCollectionCSV(e.target.files[0]); };
      inp.click();
    }
  });

  const btnPT = document.getElementById('btn-update-pt');
  if (btnPT) btnPT.addEventListener('click', () => {
    const ptMap = {};
    allDecks().forEach(deck => deck.cards.forEach(card => {
      if (card.id && card.name && !ptMap[card.id]) ptMap[card.id] = card.name;
    }));
    let count = 0;
    Object.keys(state.collection).forEach(id => {
      if (ptMap[id] && state.collection[id].name !== ptMap[id]) {
        state.collection[id].name = ptMap[id]; count++;
      }
    });
    if (!count) return showToast('Nenhuma carta para atualizar.','error');
    saveStorage(); showToast(`${count} carta(s) atualizada(s)!`); render();
  });

  // Deck export/import buttons
  const btnExportDecks = document.getElementById('btn-export-decks');
  if (btnExportDecks) btnExportDecks.addEventListener('click', exportDecks);

  const btnImportDecks = document.getElementById('btn-import-decks');
  if (btnImportDecks) btnImportDecks.addEventListener('click', importDecks);

  window.onpopstate = () => {
    if (state.selectedDeckId) { state.selectedDeckId=null; render(); }
    else if (state.selectedSet) { state.selectedSet=null; render(); }
  };
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
initTheme();
loadStorage();
render();

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
