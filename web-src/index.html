function hasNativeBridge() {
  return typeof window.AndroidStorage !== 'undefined';
}
function nativeGet(key) {
  try { return window.AndroidStorage.load(key); } catch(e) { return null; }
}
function nativeSet(key, value) {
  try { window.AndroidStorage.save(key, value); } catch(e) {}
}

function loadStorage() {
  try {
    if (hasNativeBridge()) {
      const d = nativeGet('tcg_decks');
      const c = nativeGet('tcg_collection');
      const p = nativeGet('tcg_pokedex');
      if (d) state.decks = JSON.parse(d);
      if (c) state.collection = JSON.parse(c);
      if (p) state.pokedex151 = JSON.parse(p);
      const j2 = nativeGet('tcg_pokedex_johto'); if (j2) state.pokedexJohto = JSON.parse(j2);
      const h3 = nativeGet('tcg_pokedex_hoenn');  if (h3) state.pokedexHoenn  = JSON.parse(h3);

      const g6 = nativeGet('tcg_pokedex_kalos');  if (g6) state.pokedexKalos  = JSON.parse(g6);
      const g7 = nativeGet('tcg_pokedex_alola');  if (g7) state.pokedexAlola  = JSON.parse(g7);
      const g8 = nativeGet('tcg_pokedex_galar');  if (g8) state.pokedexGalar  = JSON.parse(g8);
      const g9 = nativeGet('tcg_pokedex_paldea'); if (g9) state.pokedexPaldea = JSON.parse(g9);
      if (!d && !c) {
        const ld = localStorage.getItem('tcg_decks');
        const lc = localStorage.getItem('tcg_collection');
        const lp = localStorage.getItem('tcg_pokedex');
        if (ld) { state.decks = JSON.parse(ld); nativeSet('tcg_decks', ld); }
        if (lc) { state.collection = JSON.parse(lc); nativeSet('tcg_collection', lc); }
        if (lp) { state.pokedex151 = JSON.parse(lp); nativeSet('tcg_pokedex', lp); }
      }
    } else {
      const d = localStorage.getItem('tcg_decks');
      const c = localStorage.getItem('tcg_collection');
      const p = localStorage.getItem('tcg_pokedex');
      if (d) state.decks = JSON.parse(d);

function genId() {
  return (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseInput(text) {
  let invalid = 0;
  const SKIP_PATTERNS = /^(pok[eé]mon|treinador|energia|trainer|energy|total|\/\/).*/i;
  const cards = text.split('\n').map(l=>l.trim()).filter(Boolean).reduce((acc, line) => {
    if (SKIP_PATTERNS.test(line)) return acc;
    const parts = line.split(/\s+/);
    if (parts.length < 3) { invalid++; return acc; }
    let qty = 1;
    if (!isNaN(parseInt(parts[0],10))) qty = Math.max(1, parseInt(parts.shift(),10));
    const number = parts.pop();
    const set = parts.pop();
    const name = parts.join(' ');
    if (!name || !set || !number) { invalid++; return acc; }
    const numPadded = number.padStart(3, '0');
    const rawCard = { id: `${set}_${numPadded}`, qty, name, set, number: numPadded };
    acc.push(resolveCardName(rawCard));
    return acc;
  }, []);
  return { cards, invalidCount: invalid };
}

function resolveCardName(card) {
  if (!card || !card.id) return card;
  for (const s of SET_COLLECTIONS) {
    const found = s.cards.find(c => c.id === card.id);
    if (found && found.name !== card.name) return { ...card, name: found.name };
  }
  if (card.set && card.number) {
    const padded = card.set + '_' + card.number.padStart(3,'0');
    const unpadded = card.set + '_' + (parseInt(card.number,10) || 0).toString();
    for (const s of SET_COLLECTIONS) {
      let found = s.cards.find(c => c.id === padded) || s.cards.find(c => c.id === unpadded);
      if (found) return { ...card, id: found.id, name: found.name, number: found.number };
    }
  }
  return card;
}

function getOwnedQty(card) {
  const exact = state.collection[card.id]?.qty || 0;
  if (exact > 0) return exact;
  if (card.id) {
    const parts = card.id.split('_');
    if (parts.length === 2) {
      const altNum = parts[1].replace(/^0+/, '') || '0';
      const altNumPad = parts[1].padStart(3, '0');
      const alt1 = state.collection[parts[0] + '_' + altNum]?.qty || 0;
      if (alt1 > 0) return alt1;
      const alt2 = state.collection[parts[0] + '_' + altNumPad]?.qty || 0;
      if (alt2 > 0) return alt2;
    }
  }
  if (!card.name) return 0;
  const nameLower = card.name.toLowerCase().trim();
  return Object.values(state.collection).reduce((sum, c) => {
    if (c.name && c.name.toLowerCase().trim() === nameLower) return sum + (c.qty || 0);
    return sum;
  }, 0);
}

function calcProgress(deckCards) {
  if (!deckCards || !deckCards.length) return 0;
  const total = deckCards.reduce((a,c)=>a+c.qty,0);
  const owned = deckCards.reduce((a,c)=>a+Math.min(getOwnedQty(c), c.qty),0);
  return total===0?0:Math.floor((owned/total)*100);
}
function calcMissing(deckCards) {
  if (!deckCards || !deckCards.length) return 0;
  return deckCards.reduce((a,c)=>a+Math.max(0, c.qty-getOwnedQty(c)), 0);
}
function updateCollectionQty(card, delta, exact=null) {
  const cur = state.collection[card.id]?.qty || 0;
  let next = exact !== null ? exact : cur + delta;
  if (next < 0) next = 0;
  if (next === 0) {
    delete state.collection[card.id];
  } else {
    state.collection[card.id] = { ...card, qty: next };
    if (cur === 0) syncCollectionToPokedex(card);
  }
  saveStorage();
  render();
}
function allDecks() { return [...state.decks, ...PRESET_DECKS]; }
function selectedDeck() {
  if (!state.selectedDeckId) return null;
  return allDecks().find(d => d.id === state.selectedDeckId) || null;
}
function openCardPage(set, number) {
  // Strip any stray leading non-alphanumeric chars from both params
  const cleanSet = String(set).replace(/^[^A-Za-z0-9]+/, '');
  const cleanNum = String(number).replace(/^[^0-9]+/, '');
  const num = parseInt(cleanNum, 10) || cleanNum;
  const url = 'https://limitlesstcg.com/cards/pt/' + cleanSet + '/' + num;
  if (window.AndroidBrowser) {
    window.AndroidBrowser.open(url);
  } else {
    window.open(url, '_blank');
  }
}
function copyDeck(deck) {
  const txt = deck.cards.map(c=>`${c.qty} ${c.name} ${c.set} ${c.number}`).join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(()=>showToast(`Deck "${deck.name}" copiado!`)).catch(()=>fallbackCopy(txt,deck.name));
  } else { fallbackCopy(txt, deck.name); }
}
function fallbackCopy(txt, name) {
  const el = document.createElement('textarea');
  el.value = txt; el.style.position='fixed'; el.style.opacity='0';
  document.body.appendChild(el); el.focus(); el.select();
  try { document.execCommand('copy'); showToast(`Deck "${name}" copiado!`); }

  document.body.removeChild(el);
}

  const nameLower = card.name.toLowerCase();
  for (const pk of POKEDEX_151) {

    if (nameLower.includes(searchLower) || searchLower.includes(nameLower)) return pk.no;
  }
  return null;
}

function exportCollectionCSV() {
  const cards = Object.values(state.collection);
  if (!cards.length && !Object.keys(state.pokedex151).length) {
    return showToast('Coleção vazia, nada para exportar.', 'error');
  }
  // Export a full backup JSON: collection + all 3 pokédex gens
  const backup = {
    version: 3,
    exportedAt: new Date().toISOString(),
    collection: state.collection,
    decks: state.decks,
    pokedex151:   state.pokedex151   || {},
    pokedexJohto: state.pokedexJohto || {},
    pokedexHoenn:  state.pokedexHoenn  || {},
    pokedexSinnoh: state.pokedexSinnoh || {},
    pokedexUnova:  state.pokedexUnova  || {},
    pokedexKalos:  state.pokedexKalos  || {},
    pokedexAlola:  state.pokedexAlola  || {},
    pokedexGalar:  state.pokedexGalar  || {},
    pokedexPaldea: state.pokedexPaldea || {},
  };
  const data = JSON.stringify(backup, null, 2);
  const filename = 'ptcg-backup-' + new Date().toISOString().slice(0,10) + '.json';
  if (typeof window.AndroidExport !== 'undefined') {
    window.AndroidExport.shareCSV(filename, data);
    showToast(cards.length + ' cartas, ' + state.decks.length + ' decks + Pokédex exportados!');
  } else {
    try {
      const blob = new Blob([data], { type: 'application/json;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(cards.length + ' cartas + Pokédex exportadas!');
    } catch(e) { showToast('Erro ao exportar: ' + e.message, 'error'); }
  }
}

function processCSVText(csvText) {
  try {
    // ── Try JSON backup first (v2 format with Pokédex) ────────────
    const trimmed = csvText.trim();
    if (trimmed.startsWith('{')) {
      const backup = JSON.parse(trimmed);
      // Restore collection
      if (backup.collection && typeof backup.collection === 'object') {
        const newColl = { ...state.collection };
        let count = 0;
        Object.values(backup.collection).forEach(c => {
          if (c.id && c.qty > 0) { newColl[c.id] = c; count++; }
        });
        state.collection = newColl;
      }
      // Restore decks (merge by name, avoid duplicates)
      if (backup.decks && Array.isArray(backup.decks)) {
        backup.decks.forEach(deck => {
          if (!deck.name || !Array.isArray(deck.cards)) return;
          if (!state.decks.some(d => d.name === deck.name)) {
            state.decks.push({ id: genId(), name: deck.name,
              description: deck.description || '',
              notes: deck.notes || '',
              cards: deck.cards, createdAt: deck.createdAt || Date.now() });
          }
        });
      }
      // Restore Pokédex Gen 1
      if (backup.pokedex151 && typeof backup.pokedex151 === 'object') {
        Object.assign(state.pokedex151, backup.pokedex151);
      }
      // Restore Pokédex Gen 2
      if (backup.pokedexJohto && typeof backup.pokedexJohto === 'object') {
        if (!state.pokedexJohto) state.pokedexJohto = {};
        Object.assign(state.pokedexJohto, backup.pokedexJohto);
      }
      // Restore Pokédex Gen 3
      if (backup.pokedexHoenn  && typeof backup.pokedexHoenn  === 'object') { if (!state.pokedexHoenn)  state.pokedexHoenn  = {}; Object.assign(state.pokedexHoenn,  backup.pokedexHoenn);  }
      if (backup.pokedexSinnoh && typeof backup.pokedexSinnoh === 'object') { if (!state.pokedexSinnoh) state.pokedexSinnoh = {}; Object.assign(state.pokedexSinnoh, backup.pokedexSinnoh); }
      if (backup.pokedexUnova  && typeof backup.pokedexUnova  === 'object') { if (!state.pokedexUnova)  state.pokedexUnova  = {}; Object.assign(state.pokedexUnova,  backup.pokedexUnova);  }
      if (backup.pokedexKalos  && typeof backup.pokedexKalos  === 'object') { if (!state.pokedexKalos)  state.pokedexKalos  = {}; Object.assign(state.pokedexKalos,  backup.pokedexKalos);  }
      if (backup.pokedexAlola  && typeof backup.pokedexAlola  === 'object') { if (!state.pokedexAlola)  state.pokedexAlola  = {}; Object.assign(state.pokedexAlola,  backup.pokedexAlola);  }
      if (backup.pokedexGalar  && typeof backup.pokedexGalar  === 'object') { if (!state.pokedexGalar)  state.pokedexGalar  = {}; Object.assign(state.pokedexGalar,  backup.pokedexGalar);  }
      if (backup.pokedexPaldea && typeof backup.pokedexPaldea === 'object') { if (!state.pokedexPaldea) state.pokedexPaldea = {}; Object.assign(state.pokedexPaldea, backup.pokedexPaldea); }
      saveStorage();
      const cardCount = Object.keys(state.collection).length;
      const pdCount = Object.keys(state.pokedex151).length +
                      Object.keys(state.pokedexJohto||{}).length +
                      Object.keys(state.pokedexHoenn||{}).length;
      const deckCount = state.decks.length;
      showToast(`${cardCount} cartas, ${deckCount} decks + ${pdCount} Pokédex restaurados!`);
      render();
      return;
    }

    // ── Legacy CSV format (collection only) ───────────────────────
    const lines = csvText.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return showToast('Arquivo vazio.', 'error');
    const start = lines[0].toLowerCase().startsWith('id,') ? 1 : 0;
    let imported = 0, skipped = 0;
    const newCollection = { ...state.collection };
    lines.slice(start).forEach(line => {
      const cols = [];
      let cur = '', inQuote = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuote = !inQuote; }
        else if (ch === ',' && !inQuote) { cols.push(cur); cur = ''; }
        else { cur += ch; }
      }
      cols.push(cur);
      if (cols.length < 5) { skipped++; return; }
      const id = cols[0].trim(), name = cols[1].trim(), set = cols[2].trim(), number = cols[3].trim();
      const qty = parseInt(cols[4], 10);
      if (!id || !name || !set || !number || isNaN(qty) || qty < 1) { skipped++; return; }
      const rawImported = { id: id.trim(), name: name.trim(), set: set.trim(), number: number.trim(), qty };
      const resolved = resolveCardName(rawImported);
      const existing = newCollection[resolved.id];
      newCollection[resolved.id] = { ...resolved, qty: existing ? Math.max(existing.qty, qty) : qty };
      imported++;
    });
    if (!imported) return showToast('Nenhuma carta válida encontrada.', 'error');
    state.collection = newCollection;
    saveStorage();
    const msg = imported + ' carta' + (imported!==1?'s':'') + ' importada' +
                (imported!==1?'s':'') + (skipped>0?' ('+skipped+' ignoradas)':'') + '!';
    showToast(msg);
    render();
  } catch(err) {
    showToast('Erro ao processar arquivo.', 'error');
  }
}

function importCollectionCSV(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => processCSVText(e.target.result);
  reader.readAsText(file, 'utf-8');
}

window.onCSVImported = function(base64) {
  try {
    const csvText = decodeURIComponent(escape(atob(base64)));
    processCSVText(csvText);
  } catch(e) { processCSVText(base64); }
};

function processDeckImportText(jsonText) {
  try {
    const data = JSON.parse(jsonText);
    const imported = Array.isArray(data) ? data : (data.decks || []);
    if (!imported.length) return showToast('Nenhum deck encontrado no arquivo.', 'error');
    let added = 0, skipped = 0;
    imported.forEach(deck => {
      if (!deck.name || !Array.isArray(deck.cards)) { skipped++; return; }
      // Avoid duplicates by name
      if (state.decks.some(d => d.name === deck.name)) { skipped++; return; }
      state.decks.push({
        id: genId(),
        name: deck.name,
        description: deck.description || '',
        cards: deck.cards,
        createdAt: deck.createdAt || Date.now()
      });
      added++;
    });
    if (!added) return showToast('Todos os decks já existem (mesmo nome).', 'error');
    saveStorage();
    showToast(added + ' deck(s) importado(s)!' + (skipped > 0 ? ' (' + skipped + ' ignorado(s))' : ''));
    render();
  } catch(e) {
    showToast('Arquivo inválido. Use um JSON exportado pelo app.', 'error');
  }
}

function importDecks() {
  if (typeof window.AndroidExport !== 'undefined') {
    // Android: reutiliza o picker nativo (o callback onCSVImported receberá o JSON)
    window._deckImportMode = true;
    window.AndroidExport.pickCSV();
  } else {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => processDeckImportText(ev.target.result);
      reader.readAsText(file, 'utf-8');
    };
    inp.click();
  }
}

// Override onCSVImported to route to deck import if flagged
const _origOnCSVImported = window.onCSVImported;
window.onCSVImported = function(base64) {
  try {
    const text = decodeURIComponent(escape(atob(base64)));
    if (window._deckImportMode) {
      window._deckImportMode = false;
      processDeckImportText(text);
    } else {
      processCSVText(text);
    }
  } catch(e) {
    window._deckImportMode = false;
    processCSVText(base64);
  }
};

function buildShoppingList() {
  var source = state.shoppingSource || 'decks';

  if (source === 'decks') {
    // Consolidate missing cards across selected decks
    var deckFilter = state.shoppingDeckFilter || 'all';
    var decksToCheck = allDecks().filter(function(d){ return deckFilter === 'all' || d.id === deckFilter; });
    var cardMap = {};
    decksToCheck.forEach(function(deck) {
      deck.cards.forEach(function(card) {
        var owned = getOwnedQty(card);
        var missing = Math.max(0, card.qty - owned);
        if (missing <= 0) return;
        if (!cardMap[card.id]) cardMap[card.id] = { card: Object.assign({}, card), needed: 0, have: owned, missing: 0 };
        cardMap[card.id].missing += missing;
        cardMap[card.id].needed  += card.qty;
      });
    });
    return Object.values(cardMap).sort(function(a,b){ return a.card.name.localeCompare(b.card.name); });

  } else {
    // Set missing cards
    var setFilter = state.shoppingSetFilter || 'all';
    var typeFilter = state.shoppingSetTypeFilter || 'master';
    var setsToCheck = SET_COLLECTIONS.filter(function(s){ return setFilter === 'all' || s.sigla === setFilter; });
    var items = [];
    setsToCheck.forEach(function(s) {
      var thresh = SET_THRESHOLDS[s.sigla] || { basic: s.cards.length, complete: s.cards.length };
      var limit = typeFilter === 'basic' ? thresh.basic : s.cards.length;
      s.cards.forEach(function(card) {
        if (parseInt(card.number, 10) > limit) return;
        var qty = (state.collection[card.id] && state.collection[card.id].qty) || 0;
        if (qty > 0) return; // already have it
        items.push({ card: Object.assign({}, card), needed: 1, have: 0, missing: 1 });
      });
    });
    return items.sort(function(a,b){ return a.card.set.localeCompare(b.card.set) || parseInt(a.card.number,10) - parseInt(b.card.number,10); });
  }
}

function formatLigaPokemon(items, quality, lang) {
  var q = quality || 'nm';
  var l = lang    || 'pt';
  return items.map(function(item) {
    var c = item.card;
    // Number: always zero-padded to 3 digits
    var numPad = String(parseInt(c.number,10) || 0).padStart(3,'0');
    // Total: use basic threshold (the canonical set size for Liga Pokémon)
    var thresh = SET_THRESHOLDS[c.set];
    var setTotal = thresh ? String(thresh.basic) : String((SET_COLLECTIONS.find(function(s){ return s.sigla===c.set; })||{cards:[]}).cards.length);
    return item.missing + ' ' + c.name.toLowerCase()
      + ' (' + numPad + '/' + setTotal + ')'
      + ' [qualidade=' + q + '] [idioma=' + l + ']';
  }).join('\n');
}

function copyShoppingList() {
  const items = buildShoppingList();
  if (!items.length) return showToast('Nenhuma carta faltando!', 'error');
  const text = formatLigaPokemon(items, state.shoppingQuality, state.shoppingLang);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(() => showToast(items.length + ' itens copiados!'))
      .catch(() => fallbackCopyText(text));
  } else { fallbackCopyText(text); }
}

function fallbackCopyText(text) {
  const el = document.createElement('textarea');
  el.value = text; el.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(el); el.focus(); el.select();
  try { document.execCommand('copy'); showToast('Copiado!'); }
  catch { showToast('Erro ao copiar.','error'); }
  document.body.removeChild(el);
}

function exportShoppingList() {
  const items = buildShoppingList();
  if (!items.length) return showToast('Nenhuma carta faltando!', 'error');
  const text = formatLigaPokemon(items, state.shoppingQuality, state.shoppingLang);
  const filename = 'lista-compras-' + new Date().toISOString().slice(0,10) + '.txt';
  if (typeof window.AndroidExport !== 'undefined') {
    window.AndroidExport.shareCSV(filename, text);
    showToast(items.length + ' itens exportados!');
  } else {
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(items.length + ' itens exportados!');
  }
}

function calcDashboardStats() {
  const allCards    = Object.values(state.collection);
  const totalUnique = allCards.length;
  const totalCopies = allCards.reduce((s,c) => s+(c.qty||0), 0);

  const setStats = SET_COLLECTIONS.map(s => {
    const owned = s.cards.filter(c => (state.collection[c.id]?.qty||0)>0).length;
    const pct   = s.cards.length ? Math.floor(owned/s.cards.length*100) : 0;
    return { sigla:s.sigla, name:s.name, owned, total:s.cards.length, pct,
             series: SET_SERIES[s.sigla] || 'Outros' };
  });
  const mega = setStats.filter(s => s.series==='Mega');
  const sv   = setStats.filter(s => s.series==='Scarlet & Violet');
  const megaOwned = mega.reduce((a,s)=>a+s.owned, 0);
  const megaTotal = mega.reduce((a,s)=>a+s.total, 0);
  const svOwned   = sv.reduce((a,s)=>a+s.owned, 0);
  const svTotal   = sv.reduce((a,s)=>a+s.total, 0);

  const genDefs = [
    {label:'Kanto',  st:state.pokedex151,    total:151, gen:1},
    {label:'Johto',  st:state.pokedexJohto,  total:100, gen:2},
    {label:'Hoenn',  st:state.pokedexHoenn,  total:135, gen:3},
    {label:'Sinnoh', st:state.pokedexSinnoh, total:107, gen:4},
    {label:'Unova',  st:state.pokedexUnova,  total:156, gen:5},
    {label:'Kalos',  st:state.pokedexKalos,  total: 72, gen:6},
    {label:'Alola',  st:state.pokedexAlola,  total: 88, gen:7},
    {label:'Galar',  st:state.pokedexGalar,  total: 96, gen:8},
    {label:'Paldea', st:state.pokedexPaldea, total:120, gen:9},
  ];
  const genStats        = genDefs.map(g => ({...g, linked:Object.keys(g.st).length, pct:Math.floor(Object.keys(g.st).length/g.total*100)}));
  const totalPokedex    = genStats.reduce((a,g)=>a+g.linked, 0);
  const totalPokedexAll = genStats.reduce((a,g)=>a+g.total,  0);

  const deckStats      = state.decks.map(d => ({id:d.id, name:d.name, pct:calcProgress(d.cards), missing:calcMissing(d.cards)}));
  const completedDecks = deckStats.filter(d=>d.pct===100).length;
  const topDeck        = [...deckStats].sort((a,b)=>b.pct-a.pct)[0]||null;
  const bestDeck       = [...deckStats].filter(d=>d.pct<100).sort((a,b)=>b.pct-a.pct)[0]||null;

  return {totalUnique,totalCopies,megaOwned,megaTotal,svOwned,svTotal,
          genStats,totalPokedex,totalPokedexAll,deckStats,completedDecks,topDeck,bestDeck};
}

}

function deckEditorChangeQty(deckId, cardId, delta) {
  const deck = state.decks.find(d => d.id === deckId);
  if (!deck) return;
  const card = deck.cards.find(c => c.id === cardId);
  if (!card) return;
  card.qty = Math.max(0, card.qty + delta);
  render();
}

function deckEditorAddCard(deckId, cardObj) {
  const deck = state.decks.find(d => d.id === deckId);
  if (!deck) return;
  const existing = deck.cards.find(c => c.id === cardObj.id);
  if (existing) {
    existing.qty += 1;
  } else {
    deck.cards.push({ id: cardObj.id, name: cardObj.name, set: cardObj.set, number: cardObj.number, qty: 1 });
  }
  state.deckEditorAddSearch = '';
  render();
}

function deckEditorRemoveCard(deckId, cardId) {
  const deck = state.decks.find(d => d.id === deckId);
  if (!deck) return;
  deck.cards = deck.cards.filter(c => c.id !== cardId);
  render();
}

function buildDeckEditorModal() {
  if (!state.deckEditorId) return '';
  const deckId = state.deckEditorId;
  const deck = state.decks.find(d => d.id === deckId);
  if (!deck) return '';

  const search = (state.deckEditorSearch || '').toLowerCase();
  const addSearch = (state.deckEditorAddSearch || '').toLowerCase();

  // Filtered current cards
  const filteredCards = deck.cards.filter(c =>
    !search || c.name.toLowerCase().includes(search) || c.set.toLowerCase().includes(search)
  );

  // Total qty
  const totalQty = deck.cards.reduce((a, c) => a + c.qty, 0);
  const overLimit = totalQty > 60;

  // Search for cards to add from collection + pool
  let addResults = [];
  if (addSearch.length >= 2) {
    const seen = new Set(deck.cards.map(c => c.id));
    // Search collection
    Object.values(state.collection).forEach(c => {
      if (!c.name) return;
      if (c.name.toLowerCase().includes(addSearch) && !seen.has(c.id)) {
        addResults.push(c);
        seen.add(c.id);
      }
    });
    // Search all set collections
    for (const s of SET_COLLECTIONS) {
      for (const c of s.cards) {
        if (c.name.toLowerCase().includes(addSearch) && !seen.has(c.id)) {
          addResults.push(c);
          seen.add(c.id);
          if (addResults.length >= 20) break;
        }
      }
      if (addResults.length >= 20) break;
    }
    addResults = addResults.slice(0, 20);
  }

  let html = '<div class="modal-overlay" id="deck-editor-overlay">'
    + '<div class="modal-sheet" style="max-height:92vh">'
    + '<div class="modal-header">'
    + '<div>'
    + '<span class="modal-title">' + esc(deck.name) + '</span>'
    + (deck.isCustomized ? '<span class="badge badge-amber" style="margin-left:8px;font-size:9px">EDITADO</span>' : '')
    + '</div>'
    + '<div class="modal-actions">'
    + '<span class="badge ' + (overLimit ? 'badge-red' : 'badge-green') + '" style="font-size:11px">' + totalQty + '/60</span>'
    + '<button class="btn-pill btn-primary btn-xs" onclick="saveDeckEditorModal(\'' + deckId + '\')">' + icon('check',13) + ' Salvar</button>'
    + '<button class="btn-pill btn-ghost btn-xs" onclick="closeDeckEditorModal()">Fechar</button>'
    + '</div></div>'

    // Add card search
    + '<div class="modal-search" style="border-bottom:1px solid var(--border)">'
    + '<p class="count-label mb-6">Adicionar carta</p>'
    + '<input class="inp inp-search" id="deck-editor-add-search" placeholder="Buscar carta para adicionar..." value="' + esc(state.deckEditorAddSearch) + '" oninput="state.deckEditorAddSearch=this.value;render()">'
    + (addResults.length ? '<div style="max-height:140px;overflow-y:auto;margin-top:6px;border:1px solid var(--border);border-radius:var(--radius-sm)">'
      + addResults.map(c => {
          const inColl = (state.collection[c.id] && state.collection[c.id].qty > 0);
          return '<div onclick="deckEditorAddCard(\'' + deckId + '\',' + JSON.stringify({id:c.id,name:c.name,set:c.set,number:c.number}).replace(/"/g,'&quot;') + ')" class="modal-card">'
            + '<div class="modal-card-info">'
            + '<span class="modal-card-name">' + esc(c.name) + '</span>'
            + '<span class="mono-sm text-muted">' + c.set + ' #' + c.number + '</span>'
            + '</div>'
            + (inColl ? '<span class="badge badge-blue">Coleção</span>' : '')
            + icon('plus',14)
            + '</div>';
        }).join('')
      + '</div>' : '')
    + '</div>'

    // Search existing cards
    + '<div class="modal-search">'
    + '<input class="inp inp-search" id="deck-editor-search" placeholder="Filtrar cartas do deck..." value="' + esc(state.deckEditorSearch) + '" oninput="state.deckEditorSearch=this.value;render()">'
    + '<span class="count-label mt-6">' + filteredCards.length + ' carta' + (filteredCards.length!==1?'s':'') + ' · ' + filteredCards.reduce((a,c)=>a+c.qty,0) + ' cópias</span>'
    + '</div>'

    // Card list
    + '<div class="modal-list">';

  filteredCards.forEach(card => {
    const owned = getOwnedQty(card);
    const complete = owned >= card.qty;
    html += '<div class="modal-card" style="justify-content:space-between">'
      + '<div class="flex-gap" style="min-width:0;flex:1">'
      + '<div class="checkbox sm ' + (complete?'checked':'') + '">' + (complete?icon('check',11):'') + '</div>'
      + '<div style="min-width:0">'
      + '<span class="modal-card-name">' + esc(card.name) + '</span>'
      + '<span class="mono-sm text-muted"> ' + card.set + ' #' + card.number
      + ' <span onclick="openCardPage(\'' + card.set.replace(/[^A-Za-z0-9]/g,'') + '\',\'' + (parseInt(card.number,10)||card.number) + '\')" class="ver-link">' + icon('external',11) + '</span>'
      + '</span></div></div>'
      + '<div class="flex-gap">'
      + '<span class="mono-sm" style="color:var(--text-3)">possuí ' + owned + '</span>'
      + '<div class="counter-group">'
      + '<button class="counter-btn" ' + (card.qty<=1?'disabled':'') + ' onclick="deckEditorChangeQty(\'' + deckId + '\',\'' + card.id + '\',-1)">−</button>'
      + '<span class="counter-val ' + (complete?'green':card.qty>0?'amber':'dim') + '">' + card.qty + '</span>'
      + '<button class="counter-btn" onclick="deckEditorChangeQty(\'' + deckId + '\',\'' + card.id + '\',1)">+</button>'
      + '</div>'
      + '<button class="icon-btn danger" onclick="deckEditorRemoveCard(\'' + deckId + '\',\'' + card.id + '\')" title="Remover">' + icon('x',12) + '</button>'
      + '</div>'
      + '</div>';
  });

  if (!filteredCards.length) {
    html += '<div class="empty-state compact"><p class="empty-sub">Nenhuma carta encontrada.</p></div>';
  }

  html += '</div></div></div>';
  return html;
}

function render() {
  const activeId    = document.activeElement?.id || null;
  const activeStart = document.activeElement?.selectionStart ?? null;
  const activeEnd   = document.activeElement?.selectionEnd   ?? null;
  document.getElementById('app').innerHTML = buildApp();
  attachEvents();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (activeStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(activeStart, activeEnd); } catch(e) {}
      }
    }
  }
}

function buildApp() {
  return `${buildHeader()}<main id="main-content">${buildMain()}</main>${buildBottomNav()}${buildPokedexModal()}${buildDeckEditorModal()}`;
}

function buildHeader() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  return `<header class="app-header">
    <div class="header-inner">
      <div class="header-logo">
        <span class="logo-bolt">${icon("zap",16)}</span>
        <span class="logo-text">PTCG<span class="logo-accent">Collector</span></span>
      </div>
      <nav class="header-nav">
        ${[['decks','Decks','cards'],['league','Sets','layers'],['collection','Coleção','archive'],['dashboard','Início','home']].map(([id,label,ic]) =>
          `<button class="hnav-btn ${state.tab===id?'active':''}" data-nav="${id}">${['decks','league','collection','dashboard'].includes(id)?pngIcon({decks:'decks',league:'sets',collection:'collection',dashboard:'shopping'}[id],18)+' ':icon(ic,15)+' '}${label}</button>`
        ).join('')}
      </nav>
      <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
        ${isDark ? icon('sun',17) : icon('moon',17)}
      </button>

}

function buildBottomNav() {
  const pngNavIcons = { decks:'decks', league:'sets', collection:'collection', dashboard:'shopping' };
  const tabs = [
    { id:'decks',      label:'DECKS'   },
    { id:'league',     label:'SETS'    },
    { id:'collection', label:'COLEÇÃO'  },
    { id:'dashboard',  label:'INÍCIO'   },
  ];
  return `<nav class="bottom-nav">
    ${tabs.map(t => `
      <button class="bnav-btn ${state.tab===t.id?'active':''}" data-nav="${t.id}">
        <span class="bnav-icon">${pngIcon(pngNavIcons[t.id],26)}</span>
        <span class="bnav-label">${t.label}</span>
      </button>`).join('')}

}

function buildMain() {
  const deck = selectedDeck();
  if (deck) return buildDeckDetail(deck);
  if (state.tab === 'decks')      return buildDecksTab();
  if (state.tab === 'league')     return buildLeagueTab();
  if (state.tab === 'collection') return buildCollectionTab();
  if (state.tab === 'dashboard')  return buildDashboardTab();
  return '';
}

      <p class="empty-sub">Clique em "Novo Deck" para importar sua lista</p>
    </div>`;

  // ── Search bar ────────────────────────────────

    placeholder="Buscar deck..." value="${esc(state.deckSearch)}"
    oninput="state.deckSearch=this.value;render()">`;

  // ── Sort chips ────────────────────────────────
  const sorts = [['recent','🕐 Recentes'],['name','A–Z'],['progress','% Progresso']];
  html += `<div class="chip-row mb-12">

  if (state.deckSort === 'name')     deckList.sort((a,b)=>a.name.localeCompare(b.name,'pt'));
  else if (state.deckSort === 'progress') deckList.sort((a,b)=>calcProgress(b.cards)-calcProgress(a.cards));
  else deckList.sort((a,b)=>b.createdAt-a.createdAt);

  if (!deckList.length) {
    html += `<div class="empty-state compact"><p>Nenhum deck encontrado para "${esc(state.deckSearch)}".</p></div>`;
    return html;
  }

  html += `<div class="deck-grid">`;
  deckList.forEach(deck => {
    const pct = calcProgress(deck.cards);

             </div>`
          : `<div class="flex-gap" onclick="event.stopPropagation()">

  });
  html += `</div>`;
  return html;
}

function buildLeaguePool() {

    const ft = state.poolFilter==='todos' || c.type===state.poolFilter;
    const fs = !state.poolSearch || c.name.toLowerCase().includes(state.poolSearch.toLowerCase());
    return ft && fs;
  });
  let html = `<div class="search-row mb-8">

    html += `<div class="list-card ${owned>0?'owned':''}">

          <span class="list-card-name">${esc(card.name)}</span>

          ${card.hp?`<span class="badge badge-dim">${card.hp}PS · ${esc(card.pokemonType)}</span>`:''}
        </div>

          <button class="counter-btn" ${owned<=0?'disabled':''} data-pool-card="${encodeURIComponent(JSON.stringify(collCard))}" data-delta="-1">−</button>

        ${card.prints.map(p=>{ const pts=p.split(' '); const s=pts[0]; const n=(pts[1]||'').replace('#','');

function buildCollectionTab() {
  let html = `<div class="surface-card mb-16">
    <h2 class="card-title mb-10">Adicionar à Coleção</h2>
    <textarea class="inp inp-mono" id="manual-entry" rows="4" placeholder="Formato: Nome Sigla Número\nex: Torchic DRI 040\n\nCompatível com TCG Live">${esc(state.manualEntry)}</textarea>
    <button class="btn-pill btn-primary w-full mt-8" id="btn-add-collection">${icon("plus",15)} Adicionar Cartas</button>
  </div>`;
  const allCards = Object.values(state.collection).sort((a,b)=>a.name.localeCompare(b.name));
  const knownSets = [...new Set(allCards.map(c=>c.set).filter(Boolean))].sort();
  const filtered = allCards.filter(card => {
    const ms = !state.collSearch || card.name.toLowerCase().includes(state.collSearch.toLowerCase());
    const mset = state.collSetFilter==='todos' || card.set===state.collSetFilter;
    return ms && mset;
  });
  const grouped = {};
  filtered.forEach(card => {
    const key = card.name?.toLowerCase().trim() || card.id;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(card);
  });
  const groupKeys = Object.keys(grouped).sort();

  html += `<div class="surface-card">
    <div class="coll-header">
      <span class="card-title">Minha Coleção</span>
      <div class="coll-actions">
        <button class="btn-pill btn-ghost btn-xs" id="btn-update-pt">${icon("refresh",13)} PT</button>
        <button class="btn-pill btn-ghost btn-xs" id="btn-export-csv">${icon("upload",13)} Backup</button>
        <button class="btn-pill btn-ghost btn-xs" id="btn-import-csv">${icon("download",13)} Restaurar</button>
        <span class="badge badge-dim">${filtered.length}/${allCards.length}</span>
      </div>
    </div>
    <div class="search-filters mt-10">
      <input class="inp inp-search" id="coll-search" placeholder="Buscar por nome..." value="${esc(state.collSearch)}" oninput="state.collSearch=this.value;render()">
      <select class="inp select-inp mt-8" id="coll-set-filter" onchange="state.collSetFilter=this.value;render()">
        <option value="todos" ${state.collSetFilter==='todos'?'selected':''}>Todos os sets</option>
        ${knownSets.map(s=>`<option value="${s}" ${state.collSetFilter===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="coll-list mt-12">`;

  if (!allCards.length) {
    html += `<div class="empty-state compact"><div class="empty-icon">${icon("archive",40)}</div><p>Nenhuma carta ainda.</p></div>`;
  } else if (!groupKeys.length) {
    html += `<div class="empty-state compact"><p>Nenhuma carta encontrada.</p></div>`;
  } else {
    groupKeys.forEach(key => {
      const group = grouped[key];
      const totalQty = group.reduce((s,c)=>s+c.qty,0);
      const isMulti = group.length > 1;
      if (isMulti) {
        html += `<div class="coll-group-header">
          <div>
            <span class="coll-group-name">${esc(group[0].name)}</span>
            <span class="badge badge-dim ml-6">${group.length} versões · ${totalQty}x</span>
          </div>
        </div>`;
        group.forEach(card => {
          html += `<div class="coll-row sub-row">
            <span class="set-code-pill">${esc(card.set)} #${esc(card.number)}</span>
            <span onclick="openCardPage('${card.set.replace(/[^A-Za-z0-9]/g,"")}','${parseInt(card.number,10)||card.number}')" class="ver-link ml-4">${icon('external',12)}</span>
            <div class="counter-group ml-auto">
              <button class="counter-btn" ${card.qty<=0?'disabled':''} data-coll-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="-1">−</button>
              <span class="counter-val ${card.qty>0?'active':''}">${card.qty}</span>
              <button class="counter-btn" data-coll-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="1">+</button>
            </div>
          </div>`;
        });
      } else {
        const card = group[0];
        html += `<div class="coll-row">
          <div class="coll-row-info">
            <span class="coll-row-name">${esc(card.name)}</span>
            <span class="mono-sm text-muted">${esc(card.set)} #${esc(card.number)}
              <span onclick="openCardPage('${card.set.replace(/[^A-Za-z0-9]/g,"")}','${parseInt(card.number,10)||card.number}')" class="ver-link">${icon("external",12)}</span>
            </span>
          </div>
          <div class="counter-group">
            <button class="counter-btn" ${card.qty<=0?'disabled':''} data-coll-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="-1">−</button>
            <span class="counter-val ${card.qty>0?'active':''}">${card.qty}</span>
            <button class="counter-btn" data-coll-card="${encodeURIComponent(JSON.stringify(card))}" data-delta="1">+</button>
          </div>
        </div>`;
      }
    });
  }
  html += `</div></div>`;
  return html;
}

  return html;
}

// ── POKÉDEX ─────────────────────────────────────
function buildPokedexSlotHTML(pk, cardId, gen) {
  const done = !!cardId;
  const isManual = cardId?.startsWith('MANUAL_');
  let linkedName = '';
  if (cardId && !isManual) {
    for (const s of SET_COLLECTIONS) {
      const f = s.cards.find(c=>c.id===cardId);
      if (f) { linkedName = f.name; break; }
    }
  } else if (isManual) { linkedName = 'Manual'; }
  const onClick = gen === 1 ? `openPokedexSlot(${pk.no})`
                : gen === 2 ? `openPokedexSlotG2(${pk.no})`
                : gen === 3 ? `openPokedexSlotG3(${pk.no})`
                : gen === 4 ? `openPokedexSlotG4(${pk.no})`
                : gen === 5 ? `openPokedexSlotG5(${pk.no})`
                : gen === 6 ? `openPokedexSlotG6(${pk.no})`
                : gen === 7 ? `openPokedexSlotG7(${pk.no})`
                : gen === 8 ? `openPokedexSlotG8(${pk.no})`
                :             `openPokedexSlotG9(${pk.no})`;
  return `<div class="pokedex-slot ${done?(isManual?'manual':'done'):''}" onclick="${onClick}">
    <div class="pdex-check"><div class="checkbox sm ${done?'checked':''} ${isManual?'amber':''}">${done?icon('check',11):''}</div></div>
    <div class="pdex-info">
      <span class="pdex-no">#${String(pk.no).padStart(3,'0')}</span>
      <span class="pdex-name">${pk.name}</span>
      ${linkedName?`<span class="pdex-linked">${linkedName}</span>`:''}
    </div>
  </div>`;
}

// Verifica se o usuário POSSUI (na Coleção Global, qty > 0) alguma carta
// cujo nome corresponda a este Pokémon — usado para identificar slots vazios
// da Pokédex que já têm uma carta candidata na coleção real do usuário.
function pokedexHasCandidate(pk) {
  const sl = pk.search.toLowerCase();
  for (const id in state.collection) {
    const card = state.collection[id];
    if ((card.qty || 0) > 0 && card.name && card.name.toLowerCase().includes(sl)) return true;
  }
  return false;
}

// Verifica se o slot está possuído na Pokédex: basta ter qualquer vínculo (manual ou carta real).
// Deve ser consistente com buildPokedexSlotHTML que usa !!cardId para exibir checkmark verde.
function pokedexSlotOwned(cardId) {
  return !!cardId;
}

function buildPokedexView() {
  const gen = state.pokedexGen || 1;

  if (!state.pokedexJohto) state.pokedexJohto = {};
  if (!state.pokedexHoenn) state.pokedexHoenn = {};

  const linked1 = Object.keys(state.pokedex151).length;
  const linked2 = Object.keys(state.pokedexJohto).length;
  const linked3 = Object.keys(state.pokedexHoenn).length;

  if (!state.pokedexSinnoh) state.pokedexSinnoh = {};
  if (!state.pokedexUnova)  state.pokedexUnova  = {};
  if (!state.pokedexKalos)  state.pokedexKalos  = {};
  if (!state.pokedexAlola)  state.pokedexAlola  = {};
  if (!state.pokedexGalar)  state.pokedexGalar  = {};
  if (!state.pokedexPaldea) state.pokedexPaldea = {};
  const linked4 = Object.keys(state.pokedexSinnoh).length;
  const linked5 = Object.keys(state.pokedexUnova).length;
  const linked6 = Object.keys(state.pokedexKalos).length;
  const linked7 = Object.keys(state.pokedexAlola).length;
  const linked8 = Object.keys(state.pokedexGalar).length;
  const linked9 = Object.keys(state.pokedexPaldea).length;
  const configs = {
    1: { list: POKEDEX_151,    st: state.pokedex151,    linked: linked1, total: 151, color: 'red',    label: 'Kanto — Gen I'    },
    2: { list: POKEDEX_JOHTO,  st: state.pokedexJohto,  linked: linked2, total: 100, color: 'gold',   label: 'Johto — Gen II'   },
    3: { list: POKEDEX_HOENN,  st: state.pokedexHoenn,  linked: linked3, total: 135, color: 'blue',   label: 'Hoenn — Gen III'  },
    4: { list: POKEDEX_SINNOH, st: state.pokedexSinnoh, linked: linked4, total: 107, color: 'green',  label: 'Sinnoh — Gen IV'  },
    5: { list: POKEDEX_UNOVA,  st: state.pokedexUnova,  linked: linked5, total: 156, color: 'purple', label: 'Unova — Gen V'    },
    6: { list: POKEDEX_KALOS,  st: state.pokedexKalos,  linked: linked6, total: 72,  color: 'blue',   label: 'Kalos — Gen VI'    },
    7: { list: POKEDEX_ALOLA,  st: state.pokedexAlola,  linked: linked7, total: 88,  color: 'gold',   label: 'Alola — Gen VII'   },
    8: { list: POKEDEX_GALAR,  st: state.pokedexGalar,  linked: linked8, total: 96,  color: 'red',    label: 'Galar — Gen VIII'  },
    9: { list: POKEDEX_PALDEA, st: state.pokedexPaldea, linked: linked9, total: 120, color: 'green',  label: 'Paldea — Gen IX'   },
  };
  const cfg = configs[gen];

  let html = `<div class="detail-header">
    <button class="btn-back" id="btn-back-sets">${icon("back",16)} Voltar</button>
    <div class="detail-title-row">
      <span class="detail-title">Pokédex</span>
      <span class="badge ${gen===1?'badge-red':gen===2?'badge-amber':gen===3?'badge-blue':gen===4?'badge-green':gen===5?'badge-purple':gen===6?'badge-blue':gen===7?'badge-amber':gen===8?'badge-red':'badge-green'}">${cfg.label}</span>
    </div>
    <span class="detail-count">${cfg.linked}/${cfg.total}</span>
  </div>

  <div class="sub-tabs mb-12" style="flex-wrap:wrap">
    <button class="sub-tab ${gen===1?'active':''}" onclick="state.pokedexGen=1;render()">Kanto 151</button>
    <button class="sub-tab ${gen===2?'active':''}" onclick="state.pokedexGen=2;render()">Johto 100</button>
    <button class="sub-tab ${gen===3?'active':''}" onclick="state.pokedexGen=3;render()">Hoenn 135</button>
    <button class="sub-tab ${gen===4?'active':''}" onclick="state.pokedexGen=4;render()">Sinnoh 107</button>
    <button class="sub-tab ${gen===5?'active':''}" onclick="state.pokedexGen=5;render()">Unova 156</button>
    <button class="sub-tab ${gen===6?'active':''}" onclick="state.pokedexGen=6;render()">Kalos 72</button>
    <button class="sub-tab ${gen===7?'active':''}" onclick="state.pokedexGen=7;render()">Alola 88</button>
    <button class="sub-tab ${gen===8?'active':''}" onclick="state.pokedexGen=8;render()">Galar 96</button>
    <button class="sub-tab ${gen===9?'active':''}" onclick="state.pokedexGen=9;render()">Paldea 120</button>
  </div>

  <div class="progress-row mb-8">
    <div class="progress-track" style="flex:1">
      <div class="progress-fill ${cfg.color} glow" style="width:${Math.floor(cfg.linked/cfg.total*100)}%"></div>
    </div>
    <span class="progress-pct">${cfg.linked}/${cfg.total}</span>
  </div>`;

  // Classifica cada slot: possui / falta / disponível em coleções (mas não vinculado)
  let ownedCount = 0, missingCount = 0, availableCount = 0;
  const classified = cfg.list.map(pk => {
    const cardId = cfg.st[pk.no];
    const owned = pokedexSlotOwned(cardId);
    const hasCandidate = !owned && pokedexHasCandidate(pk);
    if (owned) ownedCount++;
    else if (hasCandidate) availableCount++;
    else missingCount++;
    return { pk, owned, hasCandidate };
  });

  const filtered = classified.filter(({owned, hasCandidate}) => {
    if (state.pokedexStatusFilter === 'owned')     return owned;
    if (state.pokedexStatusFilter === 'missing')   return !owned;
    if (state.pokedexStatusFilter === 'available') return !owned && hasCandidate;
    return true; // 'all'
  });

  html += `<div class="status-filter-row mb-12">
    <button onclick="state.pokedexStatusFilter='all';render()" class="status-btn ${state.pokedexStatusFilter==='all'?'active':''}">Todas (${cfg.list.length})</button>
    <button onclick="state.pokedexStatusFilter='owned';render()" class="status-btn green ${state.pokedexStatusFilter==='owned'?'active':''}">${icon('check',11)} Possui (${ownedCount})</button>
    <button onclick="state.pokedexStatusFilter='missing';render()" class="status-btn red ${state.pokedexStatusFilter==='missing'?'active':''}">${icon('x',11)} Falta (${missingCount})</button>
  </div>
  <div class="status-filter-row mb-12">
    <button onclick="state.pokedexStatusFilter='available';render()" class="status-btn ${state.pokedexStatusFilter==='available'?'active':''}" style="flex:1" title="Não vinculado na Pokédex, mas existe carta cadastrada em alguma coleção">${icon('link',11)} Tem em coleções, falta na Pokédex (${availableCount})</button>
  </div>

  <div class="pokedex-grid">`;

  filtered.forEach(({pk}) => {
    html += buildPokedexSlotHTML(pk, cfg.st[pk.no], gen);
  });

  if (!filtered.length) html += `<div class="empty-state compact"><p>Nenhum Pokémon encontrado com esse filtro.</p></div>`;

  html += `</div>`;
  return html;
}

function _buildPokedexModalInner(pk, linkedId, linkFn, unlinkFn, genLabel) {
  const search = state.pokedexModalSearch || pk.search;
  const matches = [];
  for (const s of SET_COLLECTIONS) {
    for (const card of s.cards) {
      if (card.name.toLowerCase().includes(search.toLowerCase())) {
        matches.push({...card, setName: s.name});
      }
    }
  }
  return `<div class="modal-overlay" id="pokedex-modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <span class="modal-title">#${String(pk.no).padStart(3,'0')} ${pk.name}</span>
          ${genLabel!=='Gen I'?`<span class="badge ${genLabel==='Gen II'?'badge-amber':genLabel==='Gen III'?'badge-blue':genLabel==='Gen IV'?'badge-green':'badge-purple'} ml-6">${genLabel}</span>`:''}
        </div>
        <div class="modal-actions">
          ${linkedId?`<button onclick="${unlinkFn}(${pk.no})" class="btn-pill btn-danger btn-xs">${icon("x",12)} Desvincular</button>`:''}
          <button onclick="closePokedexModal()" class="btn-pill btn-ghost btn-xs">Fechar</button>
        </div>
      </div>
      <div class="modal-search">
        <input class="inp inp-search" id="pokedex-modal-search" value="${esc(search)}" placeholder="Buscar carta..." oninput="state.pokedexModalSearch=this.value;render()">
        <span class="count-label mt-6">${matches.length} carta${matches.length!==1?'s':''}</span>
      </div>
      <div class="modal-list">
        ${matches.length===0
          ? `<div class="empty-state compact">
              <p class="mb-8" style="color:var(--text-2);font-size:13px">Nenhuma carta encontrada nos sets do app.</p>
            </div>`
          : matches.map(card => {
              const isLinked = card.id===linkedId;
              const inColl = (state.collection[card.id]?.qty||0)>0;
              return `<div onclick="${linkFn}(${pk.no},'${card.id}')" class="modal-card ${isLinked?'linked':''}">
                <div class="checkbox sm ${isLinked?'checked':''}">${isLinked?icon('check',11):''}</div>
                <div class="modal-card-info">
                  <span class="modal-card-name">${esc(card.name)}</span>
                  <span class="mono-sm text-muted">${card.set} #${card.number}</span>
                </div>
                ${inColl?'<span class="badge badge-blue">Na coleção</span>':''}
              </div>`;
            }).join('')
        }
        <div style="padding:12px 0 4px;border-top:1px solid var(--border);margin-top:8px;">
          <button onclick="${linkFn}(${pk.no},'MANUAL_${pk.no}')" class="btn-pill btn-amber w-full" style="justify-content:center">
            ${icon("edit",13)} Marcar como possuído manualmente
          </button>
          ${linkedId && linkedId.startsWith('MANUAL_')
            ? `<p style="text-align:center;font-size:11px;color:var(--gold);margin-top:6px">${icon("check",11)} Já marcado manualmente</p>`
            : ''}
        </div>
      </div>
    </div>
  </div>`;
}

function buildPokedexModal() {
  if (state.pokedexModal !== null) {
    const pk = POKEDEX_151.find(p=>p.no===state.pokedexModal);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, state.pokedex151[pk.no]||null, 'linkPokedexSlot', 'unlinkPokedexSlot', 'Gen I');
  }
  if (state.pokedexModalG2 !== null && state.pokedexModalG2 !== undefined) {
    const pk = POKEDEX_JOHTO.find(p=>p.no===state.pokedexModalG2);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexJohto||{})[pk.no]||null, 'linkPokedexSlotG2', 'unlinkPokedexSlotG2', 'Gen II');
  }
  if (state.pokedexModalG3 !== null && state.pokedexModalG3 !== undefined) {
    const pk = POKEDEX_HOENN.find(p=>p.no===state.pokedexModalG3);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexHoenn||{})[pk.no]||null, 'linkPokedexSlotG3', 'unlinkPokedexSlotG3', 'Gen III');
  }
  if (state.pokedexModalG4 !== null && state.pokedexModalG4 !== undefined) {
    const pk = POKEDEX_SINNOH.find(p=>p.no===state.pokedexModalG4);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexSinnoh||{})[pk.no]||null, 'linkPokedexSlotG4', 'unlinkPokedexSlotG4', 'Gen IV');
  }
  if (state.pokedexModalG5 !== null && state.pokedexModalG5 !== undefined) {
    const pk = POKEDEX_UNOVA.find(p=>p.no===state.pokedexModalG5);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexUnova||{})[pk.no]||null, 'linkPokedexSlotG5', 'unlinkPokedexSlotG5', 'Gen V');
  }
  if (state.pokedexModalG6 !== null && state.pokedexModalG6 !== undefined) {
    const pk = POKEDEX_KALOS.find(p=>p.no===state.pokedexModalG6);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexKalos||{})[pk.no]||null, 'linkPokedexSlotG6', 'unlinkPokedexSlotG6', 'Gen VI');
  }
  if (state.pokedexModalG7 !== null && state.pokedexModalG7 !== undefined) {
    const pk = POKEDEX_ALOLA.find(p=>p.no===state.pokedexModalG7);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexAlola||{})[pk.no]||null, 'linkPokedexSlotG7', 'unlinkPokedexSlotG7', 'Gen VII');
  }
  if (state.pokedexModalG8 !== null && state.pokedexModalG8 !== undefined) {
    const pk = POKEDEX_GALAR.find(p=>p.no===state.pokedexModalG8);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexGalar||{})[pk.no]||null, 'linkPokedexSlotG8', 'unlinkPokedexSlotG8', 'Gen VIII');
  }
  if (state.pokedexModalG9 !== null && state.pokedexModalG9 !== undefined) {
    const pk = POKEDEX_PALDEA.find(p=>p.no===state.pokedexModalG9);
    if (!pk) return '';
    return _buildPokedexModalInner(pk, (state.pokedexPaldea||{})[pk.no]||null, 'linkPokedexSlotG9', 'unlinkPokedexSlotG9', 'Gen IX');
  }
  return '';
}

// ─────────────────────────────────────────────
//  EVENTS
// ─────────────────────────────────────────────
function attachEvents() {
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      state.tab = el.dataset.nav;
      state.selectedDeckId = null;
      state.confirmDeleteId = null;
      state.showAddDeck = false;
      state.showMissingOnly = false;
      state.deckSearch = '';
      state.pokedexModal = null;
      state.selectedSet = null;
      render();
    });
  });

  app.querySelectorAll('[data-league-tab]').forEach(el => {
    el.addEventListener('click', () => {
      state.leagueTab = el.dataset.leagueTab || 'sets';
      state.selectedSet = null;
      state.setSearch = '';
      state.seriesFilter = 'Todos';
      state.gridTypeFilter = 'master';
      render();
    });
  });

  app.querySelectorAll('[data-open-deck]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-ask-delete],[data-confirm-delete],[data-cancel-delete]')) return;
      state.selectedDeckId = el.dataset.openDeck;
      render();
    });
  });

  app.querySelectorAll('[data-open-set]').forEach(el => {
    el.addEventListener('click', () => { state.selectedSet = el.dataset.openSet; render(); });
  });

  const backDeck = document.getElementById('btn-back-deck');
  if (backDeck) backDeck.addEventListener('click', () => { state.selectedDeckId = null; state.showMissingOnly = false; render(); });

  const backSets = document.getElementById('btn-back-sets');
  if (backSets) backSets.addEventListener('click', () => { state.selectedSet = null; state.setSearch = ''; state.setStatusFilter = 'all'; state.setTypeFilter = 'master'; render(); });

  const pdOverlay = document.getElementById('pokedex-modal-overlay');
  if (pdOverlay) pdOverlay.addEventListener('click', (e) => {
    if (e.target === pdOverlay) {
      state.pokedexModal = null;
      state.pokedexModalG2 = null;
      state.pokedexModalG3 = null;
      state.pokedexModalSearch = '';
      render();
    }
  });

  const deOverlay = document.getElementById('deck-editor-overlay');
  if (deOverlay) deOverlay.addEventListener('click', (e) => {
    if (e.target === deOverlay) closeDeckEditorModal();
  });

  const btnAddDeck = document.getElementById('btn-add-deck');
  if (btnAddDeck) btnAddDeck.addEventListener('click', () => { state.showAddDeck = !state.showAddDeck; render(); });

  const btnCancelDeck = document.getElementById('btn-cancel-deck');
  if (btnCancelDeck) btnCancelDeck.addEventListener('click', () => {
    state.showAddDeck = false; state.newDeckName=''; state.newDeckDesc=''; state.newDeckList=''; render();
  });

  const btnSaveDeck = document.getElementById('btn-save-deck');
  if (btnSaveDeck) btnSaveDeck.addEventListener('click', () => {
    const name = document.getElementById('inp-deck-name').value.trim();
    const desc = document.getElementById('inp-deck-desc').value.trim();
    const list = document.getElementById('inp-deck-list').value;
    if (!name) return showToast('O deck precisa ter um nome.','error');
    const { cards, invalidCount } = parseInput(list);
    if (invalidCount) showToast(`${invalidCount} linha(s) ignoradas.`,'error');
    if (!cards.length) return showToast('Adicione cartas válidas.','error');
    if (cards.reduce((a,c)=>a+c.qty,0)>60) return showToast('Deck ultrapassa 60 cartas.','error');
    state.decks.push({ id: genId(), name, description: desc, notes: '', cards, createdAt: Date.now() });
    state.showAddDeck = false; state.newDeckName=''; state.newDeckDesc=''; state.newDeckList='';
    saveStorage(); showToast('Deck salvo!'); render();
  });

  ['inp-deck-name','inp-deck-desc','inp-deck-list'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => {
      if (id==='inp-deck-name') state.newDeckName = el.value;
      if (id==='inp-deck-desc') state.newDeckDesc = el.value;
      if (id==='inp-deck-list') state.newDeckList = el.value;
    });
  });

  // Edit deck button
  // Duplicar deck
  app.querySelectorAll('[data-dupe-deck]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const original = state.decks.find(d => d.id === el.dataset.dupeDeck);
      if (!original) return;
      state.decks.push({
        ...original,
        id: genId(),
        name: original.name + ' (cópia)',
        notes: original.notes || '',
        createdAt: Date.now(),
        isCustomized: false,
      });
      saveStorage(); render();
      showToast('Deck duplicado!');
    });
  });

  app.querySelectorAll('[data-edit-deck]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); openDeckEditorModal(el.dataset.editDeck); });
  });

  app.querySelectorAll('[data-ask-delete]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); state.confirmDeleteId = el.dataset.askDelete; render(); });
  });
  app.querySelectorAll('[data-confirm-delete]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation();
      state.decks = state.decks.filter(d=>d.id!==el.dataset.confirmDelete);
      state.confirmDeleteId = null; saveStorage(); showToast('Deck excluído.'); render();
    });
  });
  const btnCancelDel = app.querySelector('[data-cancel-delete]');
  if (btnCancelDel) btnCancelDel.addEventListener('click', (e) => { e.stopPropagation(); state.confirmDeleteId=null; render(); });

  const btnCopy = document.getElementById('btn-copy-deck');
  if (btnCopy) btnCopy.addEventListener('click', () => { const d=selectedDeck(); if(d) copyDeck(d); });

  const btnShare = document.getElementById('btn-share-deck');
  if (btnShare) btnShare.addEventListener('click', () => {
    const d = selectedDeck();
    if (!d) return;
    const txt = d.cards.map(c=>`${c.qty} ${c.name} ${c.set} ${c.number}`).join('\n');
    const filename = d.name.replace(/[^a-z0-9]/gi,'_') + '.txt';
    window.AndroidExport.shareCSV(filename, txt);
    showToast('Abrindo compartilhamento...');
  });

  const btnToggleMissing = document.getElementById('btn-toggle-missing');
  if (btnToggleMissing) btnToggleMissing.addEventListener('click', () => { state.showMissingOnly = !state.showMissingOnly; render(); });

  app.querySelectorAll('[data-toggle-card]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation();
      const card = JSON.parse(decodeURIComponent(el.dataset.toggleCard));
      updateCollectionQty(card, 0, card._complete ? 0 : card.qty);
    });
  });

  app.querySelectorAll('[data-deck-card]').forEach(el => {
    el.addEventListener('click', () => {
      const card = JSON.parse(decodeURIComponent(el.dataset.deckCard));
      updateCollectionQty(card, parseInt(el.dataset.delta));
    });
  });
  app.querySelectorAll('[data-pool-card]').forEach(el => {
    el.addEventListener('click', () => {
      const card = JSON.parse(decodeURIComponent(el.dataset.poolCard));
      updateCollectionQty(card, parseInt(el.dataset.delta));
    });
  });
  app.querySelectorAll('[data-set-card]').forEach(el => {
    el.addEventListener('click', () => {
      const card = JSON.parse(decodeURIComponent(el.dataset.setCard));
      updateCollectionQty(card, parseInt(el.dataset.delta));
    });
  });
  app.querySelectorAll('[data-coll-card]').forEach(el => {
    el.addEventListener('click', () => {
      const card = JSON.parse(decodeURIComponent(el.dataset.collCard));
      updateCollectionQty(card, parseInt(el.dataset.delta));
    });
  });

  app.querySelectorAll('[data-pool-filter]').forEach(el => {
    el.addEventListener('click', () => { state.poolFilter = el.dataset.poolFilter; render(); });
  });

  const manualEl = document.getElementById('manual-entry');
  if (manualEl) manualEl.addEventListener('input', () => { state.manualEntry = manualEl.value; });

  const btnAddColl = document.getElementById('btn-add-collection');
  if (btnAddColl) btnAddColl.addEventListener('click', () => {
    const text = document.getElementById('manual-entry').value;
    if (!text.trim()) return;
    const { cards, invalidCount } = parseInput(text);
    if (invalidCount) showToast(`${invalidCount} linha(s) ignoradas.`,'error');
    if (!cards.length) return;
    cards.forEach(rawItem => {
      const item = resolveCardName(rawItem);
      const existing = state.collection[item.id];
      const wasZero = !existing || existing.qty === 0;
      state.collection[item.id] = { ...item, qty: (existing?.qty||0) + item.qty };
      if (wasZero) syncCollectionToPokedex(item);
    });
    state.manualEntry = '';
    saveStorage(); showToast('Coleção atualizada!'); render();
  });

  const btnExport = document.getElementById('btn-export-csv');
  if (btnExport) btnExport.addEventListener('click', exportCollectionCSV);

  const btnImport = document.getElementById('btn-import-csv');
  if (btnImport) btnImport.addEventListener('click', () => {
    if (typeof window.AndroidExport !== 'undefined') {
      window.AndroidExport.pickCSV();
    } else {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.csv';
      inp.onchange = (e) => { if (e.target.files[0]) importCollectionCSV(e.target.files[0]); };
      inp.click();
    }
  });

  const btnPT = document.getElementById('btn-update-pt');
  if (btnPT) btnPT.addEventListener('click', () => {
    const ptMap = {};
    allDecks().forEach(deck => deck.cards.forEach(card => {
      if (card.id && card.name && !ptMap[card.id]) ptMap[card.id] = card.name;
    }));
    let count = 0;
    Object.keys(state.collection).forEach(id => {
      if (ptMap[id] && state.collection[id].name !== ptMap[id]) {
        state.collection[id].name = ptMap[id]; count++;
      }
    });
    if (!count) return showToast('Nenhuma carta para atualizar.','error');
    saveStorage(); showToast(`${count} carta(s) atualizada(s)!`); render();
  });

  window.onpopstate = () => {
    if (state.selectedDeckId) { state.selectedDeckId=null; render(); }
    else if (state.selectedSet) { state.selectedSet=null; render(); }
  };
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
initTheme();
loadStorage();
render();

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
